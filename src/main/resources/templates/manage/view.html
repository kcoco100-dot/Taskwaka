<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout3}">
<th:block layout:fragment="css">
    <link rel="stylesheet" th:href="@{/dist/css/home.css}">
    <link rel="stylesheet" th:href="@{/dist/manage/manage.css}">
    <link rel="stylesheet" th:href="@{/dist/manage/project-list.css}">
</th:block>

<th:block layout:fragment="content">
    <div class="home-layout manage-layout project-list-layout">
        <nav th:replace="~{layout/pmSidebar::manageSidebar('projectView')}"></nav>
        <section class="section project-list-page" aria-labelledby="project-list-heading">
            <div class="page-heading">
                <div>
                    <h1 id="project-list-heading" class="page-title">프로젝트 조회</h1>
                    <p class="page-description">프로젝트 일정과 진행 현황을 확인하고 관리하세요.</p>
                </div>
                <a class="project-button project-button-primary" th:href="@{/{domainKey}/manage/article(domainKey=${domainKey})}" th:classappend="${activeMenu == 'dashboard' ? 'active' : ''}">+ 프로젝트 등록</a>
            </div>
            <div class="project-list-panel">
            
<form id="project-search-form"
      class="project-filters"
      method="get"
      th:action="@{/{domainKey}/manage/view(domainKey=${domainKey})}">

    <!-- 진행상태 -->
    <div class="project-field project-status-field">
        <label for="searchStatus">진행상태</label>
        <select id="searchStatus" name="status">
            <option value="all"
                    th:selected="${status == null or status == 'all'}">전체</option>
            <option value="0"
                    th:selected="${status == '0'}">예정</option>
            <option value="1"
                    th:selected="${status == '1'}">진행 중</option>
            <option value="2"
                    th:selected="${status == '2'}">완료</option>
        </select>
    </div>

    <!-- 검색유형 -->
    <div class="project-field project-type-field">
        <label for="searchType">검색유형</label>
        <select id="searchType" name="searchType">
            <option value="all"
                    th:selected="${searchType == null or searchType == 'all'}">전체</option>
            <option value="subject"
                    th:selected="${searchType == 'subject'}">프로젝트명</option>
            <option value="content"
                    th:selected="${searchType == 'content'}">프로젝트 내용</option>
            <option value="manager"
                    th:selected="${searchType == 'manager'}">담당자</option>
        </select>
    </div>

    <!-- 검색어 -->
    <div class="project-field project-keyword-field">
        <label for="searchKeyword">검색어</label>
        <input type="search"
               id="searchKeyword"
               name="keyword"
               maxlength="100"
               th:value="${keyword}"
               placeholder="검색어를 입력하세요">
    </div>

    <!-- 조회 / 초기화 -->
    <div class="project-filter-actions">
        <button type="submit"
                class="project-button project-button-primary">
            조회
        </button>
        <a class="project-button project-reset-button"
           th:href="@{/{domainKey}/manage/view(domainKey=${domainKey})}">
            초기화
        </a>
    </div>
</form>
                <div class="project-list-heading">
                    <h2>프로젝트 목록</h2>
                    <p role="status" aria-live="polite">총 <strong id="project-count" th:text=${dataCount}>6</strong>건</p>
                </div>
                <div class="project-table-wrap" tabindex="0" role="region" aria-label="프로젝트 목록 표">
                    <table class="project-list-table">
                        <caption class="project-sr-only">프로젝트명, 담당자, 참여 인원, 기간, 상태, 진행률 및 수정·삭제</caption>
                        <thead><tr>
                            <th scope="col" class="project-number">번호</th>
                            <th scope="col" class="project-name-column">프로젝트명</th>
                            <th scope="col">담당자</th>
                            <th scope="col">참여 인원</th>
                            <th scope="col">프로젝트 기간</th>
                            <th scope="col">진행 상태</th>
                            <th scope="col">진행률</th>
                        </tr></thead>
                        <tbody id="project-list-body">
                        <tr class="project-list-row" th:unless="${#lists.isEmpty(projectList)}" th:each="project : ${projectList}" data-status="progress">
                            <td class="project-number" th:text="${project.project_id}">1</td>
                            <td>
	                            <a class="project-name" 
	                            th:href="@{/{domainKey}/manage/detail/{projectId}(domainKey=${domainKey}, projectId=${project.project_id})}"
	                            th:text="${project.subject}">TASKWAKA 협업 플랫폼</a>
                            <td class="project-manager" th:text="${project.pm_name != null ? project.pm_name : '미정'}">이팀장</td>
                            <td th:text="${project.member_count} + '명'">8명</td>
                            <td class="project-period">
                            	<time class="project-start" th:datetime="${project.start_date}" th:text="${project.start_date}">2026.09.01</time>
                            	<span> ~ </span>
                            	<time class="project-end" th:datetime="${project.end_date}" th:text="${project.end_date}">2026.12.31</time></td>
							<td th:switch="${project.status}">
								<span th:case="0" class="project-status project-status-planned">예정</span>
								<span th:case="1" class="project-status project-status-progress">진행 중</span>
								<span th:case="2" class="project-status project-status-completed">완료</span>
								<span th:case="3" class="project-status project-status-paused">보류</span>
								<span th:case="*" class="project-status">상태불명</span>
							</td>
                            <td>
								<progress max="100" th:value="${project.progress}" th:aria-label="${project.subject + ' 진행률'}"></progress>
								<span th:text="${project.progress + '%'}">0%</span>
                            </td>
                        </tr>  
                        <tr id="project-empty" th:if="${#lists.isEmpty(projectList)}">
                        	<td colspan="8" class="project-empty">조회된 프로젝트가 없습니다.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
<div class="project-list-footer"
     style="display:flex; justify-content:center;
            align-items:center; position:relative;">

    <!-- 조회 건수 -->
    <p style="position:absolute; left:0; margin:0;">
        <span th:text="${dataCount == 0 ? '0' :
            ((page - 1) * size + 1) + '–' +
            (page * size > dataCount ? dataCount : page * size)}">
            0
        </span>
        /
        <span th:text="${dataCount}">0</span>건
    </p>

    <!-- 페이징 -->
    <th:block th:if="${dataCount > 0}"
              th:with="
                blockSize=5,
                startPage=${((page - 1) / blockSize) * blockSize + 1},
                endPage=${(startPage + blockSize - 1) < totalPage
                    ? (startPage + blockSize - 1) : totalPage}">

        <nav class="project-pagination"
             aria-label="프로젝트 목록 페이지">

            <!-- 이전 페이지 -->
            <a class="project-button"
               th:if="${page > 1}"
               th:href="@{/{domainKey}/manage/view(
                   domainKey=${domainKey},
                   page=${page - 1},
                   status=${status},
                   keyword=${keyword}
               )}">
                이전
            </a>

            <!-- 페이지 번호 -->
            <th:block th:each="num : ${#numbers.sequence(startPage, endPage)}">

                <span th:if="${num == page}"
                      class="project-current-page"
                      aria-current="page"
                      th:text="${num}">
                    1
                </span>

                <a th:unless="${num == page}"
                   class="project-button"
                   th:href="@{/{domainKey}/manage/view(
                       domainKey=${domainKey},
                       page=${num},
                       status=${status},
                       keyword=${keyword}
                   )}"
                   th:text="${num}">
                    2
                </a>

            </th:block>

            <!-- 다음 페이지 -->
            <a class="project-button"
               th:if="${page < totalPage}"
               th:href="@{/{domainKey}/manage/view(
                   domainKey=${domainKey},
                   page=${page + 1},
                   status=${status},
                   keyword=${keyword}
               )}">
                다음
            </a>

        </nav>
    </th:block>
</div>
            </div>
        </section>
    </div>
</th:block>
</html>
