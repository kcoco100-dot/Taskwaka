<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout3}">

<th:block layout:fragment="css">
    <link rel="stylesheet" th:href="@{/dist/css/home.css}">
    <link rel="stylesheet" th:href="@{/dist/manage/manage.css}">
    <link rel="stylesheet" th:href="@{/dist/manage/project-list.css}">
</th:block>

<th:block layout:fragment="content">
    <div class="home-layout manage-layout">
        <nav th:replace="~{layout/pmSidebar::manageSidebar('members')}"></nav>

		<div class="section manage-content">
		    <div class="page-heading">
		        <h1 class="page-title">팀원 정보 조회</h1>
		        <p class="page-description">사용하세요</p>
		    </div>
		
		    <div class="member-content">
<table class="project-list-table" style="width: 100%;">
            <thead>
                <tr>
                    <th>이름</th>
                    <th>참여 프로젝트</th>
                    <th>프로젝트 직위</th>
                    <th>상태</th>
                    <th>관리 (직위 변경 / 신규 배정)</th>
                </tr>
            </thead>
            <tbody>
                <tr class="project-list-row" th:each="member : ${teamMembers}">
                    
                    <td>
                        <strong class="project-name" th:text="${member.name}">이팀장</strong>
                    </td>
                   
					<td th:text="${member.projectName != null and member.projectName != '' ? member.projectName : '미배정'}">
		                프로젝트명
		            </td>
                   
                    <td th:switch="${member.role}">
                        <span th:case="70" class="project-status project-status-progress">PM</span>
                        <span th:case="50" class="project-status project-status-planned">DT</span>
                        <span th:case="30" class="project-status project-status-completed">TL</span>
                        <span th:case="10" class="project-status project-status-paused">AA</span>
                        <span th:case="*" class="project-status">미정</span>
                    </td>
                    
					<td>
					<span class="project-status" 
						th:classappend="${member.status == 0 ? 'project-status-completed' : 'project-status-paused'}"
						th:text="${member.status == 0 ? '참여중' : '비활성'}">참여중</span>
					</td>
                    
					<td th:if="${currentRole >= 50}">
						<div style="display: flex; gap: 5px; align-items: center;">
	                        
	                        <select class="project-select" th:id="'projectSelect_' + ${member.workspaceMemberId}" 
	                                style="padding: 6px; border-radius: 4px; border: 1px solid #ccc; min-width: 140px; cursor: pointer; position: relative; z-index: 10;">
	                            <option value="" disabled selected>-- 프로젝트 --</option>
	                            <option th:each="proj : ${projectList}" 
	                                    th:value="${proj.project_id}" 
	                                    th:text="${proj.status == 0 ? '[예정] ' + proj.subject : '[진행중] ' + proj.subject}"></option>
	                        </select>
	                        
	                        <select class="role-select" th:id="'roleSelect_' + ${member.workspaceMemberId}" 
	                                style="padding: 6px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; position: relative; z-index: 10;">
	                            <option value="" disabled selected>-- 직위 --</option>
	                            <option th:if="${currentRole >= 70}" value="70">PM</option>
	                            <option value="50">DT</option>
	                            <option value="30">TL</option>
	                            <option value="10">AA</option>
	                        </select>
	                        
	                        <button type="button" 
	                                class="project-button project-assign" 
	                                th:data-workspace-member-id="${member.workspaceMemberId}"
	                                style="background-color: #007bff; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; position: relative; z-index: 10;">배정</button>
	                    </div>
	                </td>
                </tr>

                <!-- 팀원이 0명일 때 출력되는 빈 화면 -->
                <tr th:if="${#lists.isEmpty(teamMembers)}">
                    <td colspan="5" class="project-empty" style="text-align: center; padding: 40px 0;">
                        조회된 프로젝트 팀원이 없습니다.
                    </td>
                </tr>
            </tbody>
        </table>
		    </div>
		</div>
	</div>
	
</th:block>

<th:block layout:fragment="script">
	<script>
		document.addEventListener('DOMContentLoaded', function() {
		    const pathParts = window.location.pathname.split('/');
			const domainKey = pathParts[1]; 
		
		    const assignButtons = document.querySelectorAll('.project-assign');
		    assignButtons.forEach(button => {
		    	button.addEventListener('click', function() {
		    		const workspaceMemberId = this.getAttribute('data-workspace-member-id');     
		            const projectId = document.getElementById('projectSelect_' + workspaceMemberId).value;
		            const roleInput = document.getElementById('roleSelect_' + workspaceMemberId).value;
		
		            if(!projectId) {
		                alert("프로젝트를 선택해주세요.");
		                return;
		            }
		            if(!roleInput) {
		                alert("직위를 선택해주세요.");
		                return;
		            }
		
		            fetch(`/${domainKey}/manage/assignProject`, {
		                method: 'POST',
		                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
		                body: `workspaceMemberId=${workspaceMemberId}&projectId=${projectId}&role=${roleInput}`
		            })
		            .then(response => response.json())
		            .then(data => {
		                if(data.status === 'success') {
		                    alert("배정이 완료되었습니다.");
		                    window.location.reload(); 
		                } else {
		                    alert("배정에 실패했습니다: " + (data.message || "오류 발생"));
		                }
		            })
		            .catch(error => {
		                console.error('Error:', error);
		                alert("서버와 통신 중 오류가 발생했습니다.");
		            });
		        });
		    });
		});
    </script>
</th:block>

</html>
