<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout3}">

<th:block layout:fragment="css">
    <link rel="stylesheet" th:href="@{/dist/css/home.css}">
    <link rel="stylesheet" th:href="@{/dist/css/manage/manage.css}">
    <link rel="stylesheet" th:href="@{/dist/css/manage/project-list.css}">
</th:block>

<th:block layout:fragment="content">
    <div class="home-layout manage-layout manage-member-page">
        <nav th:replace="~{layout/pmSidebar::manageSidebar('manage')}"></nav>

        <div class="section manage-content">
			<div class="page-heading" style="margin-bottom: 25px;">
			    <h1 class="page-title" style="display: inline-block; margin: 0; background: transparent">팀원 정보 조회</h1>
			    <p class="page-description"></p>
			</div>
        
		    <form method="get" class="manage-member-search" th:action="@{/{domainKey}/manage/manage(domainKey=${domainKey})}">
		        <input type="hidden" name="schType" th:value="${schType}">
		        <label for="manageMemberKeyword">팀원 검색</label>
		        <input type="search" id="manageMemberKeyword" name="kwd" th:value="${kwd}" placeholder="팀원 이름을 입력하세요">
		        <button type="submit" class="manage-member-search-button primary">검색</button>
		        <a class="manage-member-search-button" th:href="@{/{domainKey}/manage/manage(domainKey=${domainKey})}">초기화</a>
		    </form>
		    <div class="member-table-wrap">
                <table class="project-list-table">
                    <thead>
                        <tr>
                            <th style="text-align: center;">이름</th>
                            <th style="text-align: center;">참여 프로젝트</th>
                            <th style="text-align: center;">프로젝트 직위</th>
                            <th style="text-align: center;">상태</th>
                            <th style="text-align: center;">관리 (직위 변경 / 신규 배정)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="project-list-row" th:each="member : ${teamMembers}">
                            
                            <td>
                                <strong class="project-name">
								    <span th:text="${workspaceRoleNames[member.workspaceMemberId]}">과장</span>
								    <span th:text="${member.name}">이팀장</span>
								</strong>
                            </td>
                            
                            <td>
                                <div th:if="${#lists.isEmpty(member.projects)}">미배정</div>
                                
                                <div th:unless="${#lists.isEmpty(member.projects)}" class="member-project-list">
                                     
                                    <div th:each="p : ${member.projects}" 
                                         class="member-project-item"
                                         th:text="${p.projectName}">프로젝트명</div>
                                </div>
                            </td>
                            
                            <td>
                                <div th:if="${#lists.isEmpty(member.projects)}">
                                    <span class="project-status">미정</span>
                                </div>
                                
                                <div th:unless="${#lists.isEmpty(member.projects)}" class="member-project-list">
                                     
                                    <div th:each="p : ${member.projects}" 
                                         class="member-project-item member-role-item">
                                         
                                        <span th:if="${p.role == 70}" class="project-status project-status-progress">PM</span>
                                        <span th:if="${p.role == 50}" class="project-status project-status-planned">DT</span>
                                        <span th:if="${p.role == 30}" class="project-status project-status-completed">TL</span>
                                        <span th:if="${p.role == 10}" class="project-status project-status-paused">AA</span>
                                        
                                        <button th:if="${currentRole == 70 or (currentRole == 50 and (p.role == 30 or p.role == 10))}" type="button" class="btn-exclude-project" th:data-id="${p.projectMemberId}"
                                                style="background-color: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-left: 5px;">제외</button>
                                    </div>
                                </div>
                            </td>
                            
                            <td>
                                <span class="project-status" 
                                      th:classappend="${#lists.isEmpty(member.projects) ? 'project-status-paused' : 'project-status-completed'}"
                                      th:text="${#lists.isEmpty(member.projects) ? '대기중' : '참여중'}">참여중</span>
                            </td>
                            
                            <td th:if="${currentRole >= 50}">
                                <div style="display: flex; gap: 5px; align-items: center;">
                                    
                                    <select class="project-select" th:id="'projectSelect_' + ${member.workspaceMemberId}" 
                                            style="padding: 6px; border-radius: 4px; border: 1px solid #ccc; min-width: 140px; cursor: pointer; position: relative; z-index: 10;">
                                        <option value="" disabled selected>-- 프로젝트 --</option>
                                        <option th:each="proj : ${projectList}" 
                                                th:value="${proj.project_id}" 
                                                th:text="${proj.status == 0 ? '[예정] ' + proj.subject : '[진행중] ' + proj.subject}"></option>
                                    </select>
                                    
                                    <select class="role-select" th:id="'roleSelect_' + ${member.workspaceMemberId}" 
                                            style="padding: 6px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; position: relative; z-index: 10;">
                                        <option value="" disabled selected>-- 직위 --</option>
                                        <option th:if="${currentRole == 70 and ownWorkspaceMemberId != null and member.workspaceMemberId == ownWorkspaceMemberId}" value="70">PM</option>
                                        <option th:if="${currentRole == 70}" value="50">DT</option>
                                        <option value="30">TL</option>
                                        <option value="10">AA</option>
                                    </select>
                                    
                                    <button type="button" 
                                            class="project-button project-assign" 
                                            th:data-workspace-member-id="${member.workspaceMemberId}"
                                            style="background-color: #007bff; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; position: relative; z-index: 10;">배정</button>

                                    <button th:if="${currentRole == 70}" type="button" class="btn-exclude-workspace" th:data-id="${member.workspaceMemberId}"
                                            style="background-color: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-left: 5px;">워크 제외</button>
                                </div>
                            </td>
                            <td th:unless="${currentRole >= 50}">조회 전용</td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(teamMembers)}">
                            <td colspan="5" class="project-empty" style="text-align: center; padding: 40px 0;">
                                조회된 프로젝트 팀원이 없습니다.
                            </td>
                        </tr>
                    </tbody>
                </table>
                </div>
                <div class="project-list-footer manage-member-footer">
                    <p th:text="|총 ${dataCount}명|">총 0명</p>
                    <nav class="project-pagination" aria-label="팀원 목록 페이지" th:if="${totalPage > 0}">
                        <a class="manage-page-arrow" th:if="${page > 1}" th:href="${pageBaseUrl + (page - 1)}">이전</a>
                        <span class="manage-page-arrow disabled" th:unless="${page > 1}">이전</span>
                        <div th:utext="${paging}"></div>
                        <a class="manage-page-arrow" th:if="${page < totalPage}" th:href="${pageBaseUrl + (page + 1)}">다음</a>
                        <span class="manage-page-arrow disabled" th:unless="${page < totalPage}">다음</span>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</th:block>

<th:block layout:fragment="script">
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            const domainKey = /*[[${domainKey}]]*/ "";
            const contextPath = /*[[@{/}]]*/ "/";
            const csrfHeader = /*[[${_csrf != null ? _csrf.headerName : null}]]*/ null;
            const csrfToken = /*[[${_csrf != null ? _csrf.token : null}]]*/ null;
            const requestHeaders = { 'Content-Type': 'application/x-www-form-urlencoded' };
            if (csrfHeader && csrfToken) {
                requestHeaders[csrfHeader] = csrfToken;
            } 
        
            const assignButtons = document.querySelectorAll('.project-assign');
            assignButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const workspaceMemberId = this.getAttribute('data-workspace-member-id');     
                    const projectId = document.getElementById('projectSelect_' + workspaceMemberId).value;
                    const roleInput = document.getElementById('roleSelect_' + workspaceMemberId).value;
        
                    if(!projectId) {
                        alert("프로젝트를 선택해주세요.");
                        return;
                    }
                    if(!roleInput) {
                        alert("직위를 선택해주세요.");
                        return;
                    }
        
                    fetch(`${contextPath}${domainKey}/manage/assignProject`, {
                        method: 'POST',
                        headers: requestHeaders,
                        body: `workspaceMemberId=${workspaceMemberId}&projectId=${projectId}&role=${roleInput}`
                    })
                    .then(response => response.json())
                    .then(data => {
                        if(data.status === 'success') {
                            alert("배정이 완료되었습니다.");
                            window.location.reload(); 
                        } else {
                            alert("배정에 실패했습니다.");
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert("서버와 통신 중 오류가 발생했습니다.");
                    });
                });
            });

            document.querySelectorAll('.btn-exclude-project').forEach(button => {
                button.addEventListener('click', function() {
                    if(!confirm("해당 팀원을 이 프로젝트에서 제외하시겠습니까?")) {
                        return;
                    }
                    
                    const projectMemberId = this.getAttribute('data-id');
                    const formData = new URLSearchParams();
                    formData.append('projectMemberId', projectMemberId);

                    fetch(`${contextPath}${domainKey}/manage/excludeProject`, {
                        method: 'POST',
                        headers: requestHeaders,
                        body: formData
                    })
                    .then(res => res.json())
                    .then(data => {
                        if(data.status === 'success') {
                            alert('프로젝트에서 제외되었습니다.');
                            location.reload();
                        } else {
                            alert('처리 중 오류가 발생했습니다.');
                        }
                    });
                });
            });

            document.querySelectorAll('.btn-exclude-workspace').forEach(button => {
                button.addEventListener('click', function() {
                    if(!confirm("정말 이 팀원을 워크스페이스에서 제외하시겠습니까?")) {
                        return;
                    }
                    
                    const workspaceMemberId = this.getAttribute('data-id');
                    const formData = new URLSearchParams();
                    formData.append('workspaceMemberId', workspaceMemberId);

                    fetch(`${contextPath}${domainKey}/manage/excludeWorkspace`, {
                        method: 'POST',
                        headers: requestHeaders,
                        body: formData
                    })
                    .then(res => res.json())
                    .then(data => {
                        if(data.status === 'success') {
                            alert('워크스페이스에서 제외되었습니다.');
                            location.reload();
                        } else {
                            alert('처리 중 오류가 발생했습니다.');
                        }
                    });
                });
            });
        });
    </script>
</th:block>

</html>
