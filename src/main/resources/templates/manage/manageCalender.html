<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout3}">

<th:block layout:fragment="css">
    <link rel="stylesheet" th:href="@{/dist/css/home.css}">
    <link rel="stylesheet" th:href="@{/dist/manage/manage.css}">
    <link rel="stylesheet" th:href="@{/dist/manage/manageCalender.css}">
</th:block>

<th:block layout:fragment="content">
    <div class="home-layout manage-layout">
        <nav th:replace="~{layout/pmSidebar::manageSidebar('manageCalender')}"></nav>

        <div class="section manage-content">
            <div class="page-heading">
                <h1 class="page-title">프로젝트 캘린더</h1>
                <p class="page-description">
                    PM은 워크스페이스 전체, 그 외 직위는 참여 중인 프로젝트의 일정을 확인하세요.
                </p>
            </div>

            <div class="calendar-content">
                <div id="myTaskCalendar"></div>
            </div>
        </div>
    </div>
</th:block>

<th:block layout:fragment="script">
    <script th:src="@{/dist/vendor/fullcalendar6/dist/index.global.min.js}"></script>
    <script th:src="@{/dist/vendor/fullcalendar6/dist/locales/ko.global.min.js}"></script>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {

            const calendarEl = document.getElementById('myTaskCalendar');

            if (!calendarEl) {
                return;
            }

            const tasks = /*[[${myTasks}]]*/ [];

            function nextDate(dateString) {
                const [year, month, day] = dateString.split('-').map(Number);

                return new Date(
                    Date.UTC(year, month - 1, day + 1)
                ).toISOString().slice(0, 10);
            }

            const taskEvents = (Array.isArray(tasks) ? tasks : [])
                .filter(function(task) {
                    return task.startAt && task.endAt;
                })
                .map(function(task) {
                    return {
                        id: String(task.taskId),
                        title: `${task.projectName} · ${task.title} (${task.progress ?? 0}%)`,
                        start: task.startAt,
                        end: nextDate(task.endAt),
                        allDay: true
                    };
                });

            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'ko',
                height: 'auto',

                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: ''
                },

                events: taskEvents
            });

            calendar.render();
        });
    </script>
</th:block>

</html>
