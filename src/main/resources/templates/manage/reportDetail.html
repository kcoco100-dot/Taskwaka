<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout3}">

<th:block layout:fragment="css">
    <link rel="stylesheet" th:href="@{/dist/css/home.css}">
    <link rel="stylesheet" th:href="@{/dist/manage/manage.css}">
    <link rel="stylesheet" th:href="@{/dist/manage/approval.css}">
</th:block>

<th:block layout:fragment="content">
    <div class="home-layout manage-layout approval-layout">
        <nav th:replace="~{layout/pmSidebar::manageSidebar('approval')}"></nav>

        <section class="section approval-page">
            <div class="page-heading">
                <h1 class="page-title" th:text="${dto.reportTitle}">보고서 제목</h1>
                <p class="page-description" th:text="${dto.reportTypeName}">보고서 유형</p>
            </div>

            <div class="approval-panel">
                
                

                <div class="approval-table-wrap">
                    <table class="approval-table approval-detail-table">
                        <tbody>
                            <tr><th>프로젝트명</th><td th:text="${dto.projectName}">프로젝트</td></tr>
                            <tr><th>업무명</th><td th:text="${dto.taskName}">업무</td></tr>
                            <tr><th>보고서명</th><td th:text="${dto.reportTitle}">제목</td></tr>
                            <tr><th>작성자</th><td th:text="${dto.authorName}">작성자</td></tr>
                            <tr><th>작성일</th><td th:text="${dto.createdDate}">작성일</td></tr>
                            <tr><th>진행단계</th><td th:text="${dto.stageName}">단계</td></tr>
                            <tr><th>진행률</th><td th:text="|${dto.progress}%|">0%</td></tr>
                            <tr>
                                <th>처리 상태</th>
                                <td>
                                    <span th:if="${dto.reviewStatus == 1}" class="approval-status approval-status-unread">미확인</span>
                                    <span th:if="${dto.reviewStatus == 2}" class="approval-status approval-status-pending">대기</span>
                                    <span th:if="${dto.reviewStatus == 3}" class="approval-status approval-status-reviewed">승인</span>
                                    <span th:if="${dto.reviewStatus == 4}" class="approval-status approval-status-rejected">반려</span>
                                </td>
                            </tr>
                            <tr th:if="${dto.reviewedDate != null}"><th>처리일</th><td th:text="${dto.reviewedDate}">처리일</td></tr>
                            <tr th:if="${dto.reviewComment != null}"><th>검토 의견</th><td class="approval-detail-content" th:text="${dto.reviewComment}">의견</td></tr>
                            <tr th:if="${dto.reviewStatus == 4}"><th>반려 사유</th><td class="approval-detail-content" th:text="${dto.rejectReason}">사유</td></tr>
                            <tr><th>보고서 내용</th><td class="approval-detail-content" th:text="${dto.content}">보고서 본문</td></tr>
                        <tr><th>첨부파일</th><td>
                                <p th:if="${#lists.isEmpty(files)}">첨부파일이 없습니다.</p>
                                <p th:each="file : ${files}">
                                    <a th:href="@{/{domainKey}/manage/approval/files/{id}(domainKey=${domainKey},id=${file.fileId},reportCategory=${dto.reportCategory},reportId=${dto.reportId})}" th:text="${file.originalName}"></a>
                                    <small th:text="|(${file.fileSize} bytes)|"></small>
                                </p>
                            </td></tr>
                        </tbody>
                    </table>
                </div>

                <div th:if="${dto.canReview == 1 and dto.reviewStatus == 2}" class="approval-review-forms">
                    <form th:action="@{/{domainKey}/manage/approval/updateReview(domainKey=${domainKey})}" method="post" class="approval-review-form">
                        <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="reportCategory" th:value="${dto.reportCategory}">
                        <input type="hidden" name="reportId" th:value="${dto.reportId}">
                        <input type="hidden" name="reviewStatus" value="3">
                        <div class="approval-field">
                            <label for="approve-comment">검토 의견 (선택)</label>
                            <textarea id="approve-comment" name="reviewComment" rows="3" maxlength="1000"></textarea>
                        </div>
                        <button class="approval-button approval-button-primary" type="submit">승인</button>
                    </form>
                    <form th:action="@{/{domainKey}/manage/approval/updateReview(domainKey=${domainKey})}" method="post" class="approval-review-form">
                        <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="reportCategory" th:value="${dto.reportCategory}">
                        <input type="hidden" name="reportId" th:value="${dto.reportId}">
                        <input type="hidden" name="reviewStatus" value="4">
                        <div class="approval-field">
                            <label for="reject-reason">반려 사유 (필수)</label>
                            <textarea id="reject-reason" name="rejectReason" rows="3" maxlength="1000" required></textarea>
                        </div>
                        <button class="approval-button" type="submit">반려</button>
                    </form>
                </div>

                <div class="approval-detail-footer">
                    <a class="approval-button" th:if="${prevReport != null}" th:href="@{/{domainKey}/manage/approval/detail(domainKey=${domainKey},reportCategory=${prevReport.reportCategory},reportId=${prevReport.reportId},listCategory=${listCategory},reviewStatus=${reviewStatus},schType=${schType},kwd=${kwd},page=${page})}" th:text="|이전: ${prevReport.reportTitle}|"></a>
                    <a class="approval-button" th:if="${nextReport != null}" th:href="@{/{domainKey}/manage/approval/detail(domainKey=${domainKey},reportCategory=${nextReport.reportCategory},reportId=${nextReport.reportId},listCategory=${listCategory},reviewStatus=${reviewStatus},schType=${schType},kwd=${kwd},page=${page})}" th:text="|다음: ${nextReport.reportTitle}|"></a>
                </div>
                <div class="approval-detail-footer">
                    <a th:if="${dto.reportCategory == 1}" class="approval-button" th:href="@{/{domainKey}/manage/approval/update/{id}(domainKey=${domainKey},id=${dto.reportId})}">수정</a>
                    <form th:if="${dto.reportCategory == 1}" method="post" th:action="@{/{domainKey}/manage/approval/delete/{id}(domainKey=${domainKey},id=${dto.reportId})}" onsubmit="return confirm('보고서와 첨부파일을 삭제하시겠습니까?');">
                        <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="approval-button">삭제</button>
                    </form>
                    <a class="approval-button" th:href="@{/{domainKey}/manage/approval(domainKey=${domainKey},reportCategory=${listCategory},reviewStatus=${reviewStatus},schType=${schType},kwd=${kwd},page=${page})}">목록으로</a>
                </div>
            </div>
        </section>
    </div>
</th:block>
</html>
