<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout3}">

<th:block layout:fragment="css">
    <link rel="stylesheet" th:href="@{/dist/css/home.css}">
    <link rel="stylesheet" th:href="@{/dist/css/manage/manage.css}">
    <link rel="stylesheet" th:href="@{/dist/css/manage/approval.css}">
    <link rel="stylesheet" th:href="@{/dist/css/manage/reportwrite.css}">
</th:block>

<th:block layout:fragment="content">
    <div class="home-layout manage-layout approval-layout">
        <nav th:replace="~{layout/pmSidebar::manageSidebar('approval')}"></nav>

        <section class="section approval-page report-write-page" aria-labelledby="report-write-heading">
            <div class="page-heading">
                <div>
                    <h1 id="report-write-heading" class="page-title" th:text="${mode == 'write' ? '프로젝트 보고서 등록' : '프로젝트 보고서 수정'}">프로젝트 보고서 등록</h1>
                    <p class="page-description">프로젝트 진행 상황을 작성하고 자료를 첨부하세요.</p>
                </div>
            </div>

            <div class="report-write-panel">
                <div class="report-write-intro">
                    <h2>보고서 작성</h2>
                    <p>프로젝트, 제목, 진행률, 내용 입력 후 등록완료를 눌러 주세요.</p>
                </div>

                <form id="reportForm" name="reportForm" method="post" enctype="multipart/form-data"
                      th:action="${mode == 'write'} ? @{/{domainKey}/manage/approval/write(domainKey=${domainKey})} : @{/{domainKey}/manage/approval/update/{id}(domainKey=${domainKey},id=${dto.reportId})}"
                      th:object="${dto}">
                    <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" id="projectMemberId" th:field="*{projectMemberId}">
                    <div class="report-form-grid">
                        <div class="report-form-field full">
                            <label for="reportProject">프로젝트 <span aria-hidden="true">*</span></label>
                            <input th:if="${mode != 'write'}" type="hidden" th:field="*{projectId}">
                            <select id="reportProject" th:field="*{projectId}" th:disabled="${mode != 'write'}" required>
                                <option value="">프로젝트를 선택하세요</option>
                                <option th:each="p : ${projectOptions}" th:value="${p.projectId}" th:attr="data-member-id=${p.projectMemberId},data-progress=${p.progress}" th:text="${p.projectName}">프로젝트명</option>
                            </select>
                            <p class="report-helper">현재 참여 중인 프로젝트만 선택할 수 있습니다.</p>
                        </div>

                        <div class="report-form-field full">
                            <label for="reportTitle">보고서 제목 <span aria-hidden="true">*</span></label>
                            <input type="text" id="reportTitle" th:field="*{reportTitle}"
                                   maxlength="200" placeholder="보고서 제목을 입력하세요" required>
                        </div>

                        <div class="report-form-field">
						    <label for="reportProgress">현재 프로젝트 진행률</label>
						    <input type="text" id="reportProgress" value="프로젝트를 선택하세요" readonly>
						    <p class="report-helper">
						        업무 진행 현황으로 계산된 값입니다.
						        프로젝트 보고서 작성·승인은 프로젝트 진행률을 변경하지 않습니다.
						    </p>
						</div>

                        <div class="report-form-field">
                            <label>보고서 유형</label>
                            <input type="text" value="프로젝트 보고서" readonly aria-label="프로젝트 보고서">
                        </div>

                        <div class="report-form-field full">
                            <label for="reportContent">보고서 내용 <span aria-hidden="true">*</span></label>
                            <textarea id="reportContent" th:field="*{content}"
                                      placeholder="진행 현황, 주요 완료 업무, 향후 계획 등을 작성하세요" required></textarea>
                        </div>

                        <div class="report-form-field full">
                            <label for="reportFiles">첨부파일</label>
                            <div th:each="file : ${files}" class="report-helper">
                                <label><input type="checkbox" name="deleteFileIds" th:value="${file.fileId}"> 삭제
                                    <span th:text="${file.originalName}"></span></label>
                            </div>
                            <div class="report-file-box">
                                <input type="file" id="reportFiles" name="files" multiple>
                                <span class="report-helper" id="fileSummary">선택된 파일 없음</span>
                            </div>
                            <ul class="pending-upload-list" id="selectedFiles" hidden></ul>
                        </div>
                    </div>

                    <div class="report-actions">
                        <button type="submit" class="approval-button approval-button-primary" th:text="${mode == 'write' ? '등록완료' : '수정완료'}">등록완료</button>
                        <button type="reset" class="approval-button">다시입력</button>
                        <a class="approval-button" th:href="@{/{domainKey}/manage/approval(domainKey=${domainKey})}">취소</a>
                    </div>
                </form>
            </div>
        </section>
    </div>
</th:block>

<th:block layout:fragment="script">
    <script>
    function renderPendingFiles(input, summary, list) {
        const selected = Array.from(input.files || []);

        summary.textContent = selected.length
            ? selected.length + '개 파일 선택'
            : '선택된 파일 없음';

        list.replaceChildren();
        list.hidden = selected.length === 0;

        selected.forEach((file, index) => {
            const item = document.createElement('li');

            const name = document.createElement('span');
            name.className = 'pending-upload-name';
            name.textContent = file.name;

            const removeButton = document.createElement('button');
            removeButton.type = 'button';
            removeButton.className = 'pending-upload-remove';
            removeButton.textContent = '삭제';
            removeButton.setAttribute(
                'aria-label', file.name + ' 첨부 취소');

            removeButton.addEventListener('click', () => {
                const transfer = new DataTransfer();

                Array.from(input.files || []).forEach(
                    (remainingFile, currentIndex) => {
                        if (currentIndex !== index) {
                            transfer.items.add(remainingFile);
                        }
                    }
                );

                input.files = transfer.files;

                input.dispatchEvent(
                    new Event('change', { bubbles: true })
                );
            });

            item.append(name, removeButton);
            list.appendChild(item);
        });
    }
    
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('reportForm');
        const project = document.getElementById('reportProject');
        const memberId = document.getElementById('projectMemberId');
        const files = document.getElementById('reportFiles');
        const summary = document.getElementById('fileSummary');
        const fileList = document.getElementById('selectedFiles');
        const progressInput = document.getElementById('reportProgress');
        
        function syncProject() {
            const option = project.selectedOptions[0];
            if (!option || !option.value) {
                memberId.value = '';
                progressInput.value = '프로젝트를 선택하세요';
                
                return;
            }

            memberId.value = option.dataset.memberId || '';

            const progress = Number(option.dataset.progress);
            progressInput.value = (Number.isFinite(progress) ? progress : 0) + '%';
        }
        
        function syncFiles() {
            renderPendingFiles(files, summary, fileList);
        }

        project.addEventListener('change', syncProject);
        files.addEventListener('change', syncFiles);
        form.addEventListener('reset', function () {
            setTimeout(function () { syncProject(); syncFiles(); }, 0);
        });
        form.addEventListener('submit', function (e) {
            syncProject();
            if (!project.value) {
                e.preventDefault();
                alert('등록할 수 있는 프로젝트를 선택해 주세요.');
            }
        });
        syncProject();
    });
    </script>
</th:block>
</html>
