<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout3}">

<th:block layout:fragment="css">
	<style type="text/css">
		.chat-msg-container { display: flex; flex-direction:column; height: 310px; overflow-y: scroll; }
		.chat-connection-list { height: 355px; overflow-y: scroll; }
		.chat-connection-list span { display: block; cursor: pointer; margin-bottom: 3px; }
		.chat-connection-list span:hover { color: #0d6efd; }
		
		.user-left {
			color: #0d6efd;
			font-weight: 700;
			font-size: 10px;
			margin-left: 3px;
			margin-bottom: 1px;
		}
		
		.chat-info, .msg-left, .msg-right {
			max-width: 350px;
			line-height: 1.5;
			font-size: 13px;
			padding: 0.35em 0.65em;
			border: 1px solid #ccc;
			color: #333;
			white-space: pre-wrap;
			vertical-align: baseline;
			border-radius: 0.25rem;
		}
		.chat-info {
			background: #f8f9fa;
			color: #333;
			margin-right: auto;
			margin-left: 3px;
			margin-bottom: 5px;
		}
		.msg-left {
			margin-right: auto;
			margin-left: 8px;
			margin-bottom: 5px;
		}
		.msg-right {
			margin-left: auto;
			margin-right: 3px;
			margin-bottom: 5px;
		}
	</style>
</th:block>
  	  
<th:block layout:fragment="content">
	<!-- Page Title -->
	<div class="page-title">
		<div class="container align-items-center" data-aos="fade-up">
			<h1>Chatting</h1>
			<div class="page-title-underline-accent"></div>
		</div>
	</div>
    
	<!-- Page Content -->    
	<div class="section">
		<div class="container" data-aos="fade-up" data-aos-delay="100">
		
			<div class="row justify-content-center">
				<div class="col-md-10 bg-white box-shadow my-4 p-5">

					<div class="row">
						<div class="col-8">
							<p class="form-control-plaintext fs-6"><i class="bi bi-chevron-double-right"></i> 채팅 메시지</p>
							<div class="border p-3 chat-msg-container"></div>
							<div class="mt-2">
								<input type="text" id="chatMsg" class="form-control" 
									placeholder="채팅 메시지를 입력 하세요...">
							</div>
						</div>
						<div class="col-4">
							<p class="form-control-plaintext fs-6"><i class="bi bi-chevron-double-right"></i> 접속자 리스트<span id='today'></span></p>
							<div class="border p-3 chat-connection-list"></div>
						</div>
					</div>

				</div>
			</div>
			
		</div>
	</div>
</th:block>

<th:block layout:fragment="aside-container">
	<!-- 귓속말 Modal -->
	<div class="modal fade" id="myDialogModal" tabindex="-1" aria-labelledby="myDialogModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="myDialogModalLabel">귓속말</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body pt-1">
					<input type="text" id="chatOneMsg" class="form-control" 
								placeholder="귓속말을 입력 하세요...">
				</div>
			</div>
		</div>
	</div>
</th:block>	

<th:block layout:fragment="script">
	

    <!-- SockJS 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>

    <!-- STOMP 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <script th:inline="javascript">

        // STOMP 클라이언트
        let stompClient = null;

        // Thymeleaf에서 WebSocket 연결 주소 설정
        const socketUrl = /*[[@{/ws-chat}]]*/ "/ws-chat";

        // HTML이 모두 준비되면 실행
        document.addEventListener("DOMContentLoaded", function() {

            const chatMsg = document.getElementById("chatMsg");

            const messageContainer =
                document.querySelector(".chat-msg-container");

            const userList =
                document.querySelector(".chat-connection-list");

            // 연결 상태 표시
            const status = document.createElement("p");
            status.textContent = "WebSocket 연결 중...";

            messageContainer.before(status);

            // 접속자 목록은 추후 구현
            if (userList) {
                userList.textContent =
                    "접속자 목록은 다음 단계에서 구현합니다.";
            }

            // ====================================
            // 1. WebSocket 연결
            // ====================================
            function connect() {

                try {

                    // 라이브러리 로딩 확인
                    if (typeof SockJS === "undefined"
                            || typeof Stomp === "undefined") {

                        throw new Error(
                            "SockJS 또는 STOMP 라이브러리를 불러오지 못했습니다."
                        );
                    }

                    // WebSocket 연결 객체 생성
                    const socket = new SockJS(socketUrl);

                    // STOMP 클라이언트 생성
                    stompClient = Stomp.over(socket);

                    // STOMP 디버그 로그 비활성화
                    stompClient.debug = null;

                    // 서버에 연결
                    stompClient.connect(

                        {},

                        // 연결 성공
                        function(frame) {

                            try {

                                status.textContent =
                                    "WebSocket 연결 성공!";

                                console.log("연결 성공:", frame);

                                // 메시지 구독
                                stompClient.subscribe(
                                    "/topic/chat.test",

                                    function(response) {

                                        try {

                                            const msg =
                                                JSON.parse(response.body);

                                            appendMessage(msg);

                                        } catch(error) {

                                            console.error(
                                                "메시지 수신 오류:",
                                                error
                                            );
                                        }
                                    }
                                );

                            } catch(error) {

                                status.textContent =
                                    "메시지 구독 실패";

                                console.error(
                                    "구독 처리 오류:",
                                    error
                                );
                            }
                        },

                        // 비동기 연결 실패
                        function(error) {

                            status.textContent =
                                "WebSocket 연결 실패";

                            console.error(
                                "연결 오류:",
                                error
                            );
                        }
                    );

                    // 연결이 끊겼을 때
                    socket.onclose = function(event) {

                        status.textContent =
                            "WebSocket 연결 종료";

                        console.log("연결 종료:", event);
                    };

                } catch(error) {

                    status.textContent =
                        "WebSocket 연결 준비 실패";

                    console.error(
                        "WebSocket 설정 오류:",
                        error
                    );
                }
            }


            // ====================================
            // 2. 메시지 전송
            // ====================================
            function sendMessage() {

                try {

                    const message = chatMsg.value.trim();

                    // 빈 메시지 검사
                    if (!message) {
                        return;
                    }

                    // WebSocket 연결 확인
                    if (!stompClient || !stompClient.connected) {

                        alert("채팅 서버에 연결되지 않았습니다.");
                        return;
                    }

                    // 서버로 보낼 데이터
                    const data = {
                        message: message
                    };

                    // 서버로 메시지 전송
                    stompClient.send(
                        "/app/chat.test",
                        {},
                        JSON.stringify(data)
                    );

                    // 입력창 초기화
                    chatMsg.value = "";
                    chatMsg.focus();

                } catch(error) {

                    console.error(
                        "메시지 전송 오류:",
                        error
                    );

                    alert("메시지 전송 중 오류가 발생했습니다.");
                }
            }


            // ====================================
            // 3. 메시지 화면에 출력
            // ====================================
            function appendMessage(msg) {

                try {

                    const sender =
                        msg.sender ?? "알 수 없음";

                    const message =
                        msg.message ?? "";

                    // 메시지를 담을 div 생성
                    const div = document.createElement("div");

                    div.className = "msg-left";

                    // 메시지 출력
                    div.textContent =
                        sender + " : " + message;

                    // 채팅 영역에 추가
                    messageContainer.appendChild(div);

                    // 스크롤을 맨 아래로 이동
                    messageContainer.scrollTop =
                        messageContainer.scrollHeight;

                } catch(error) {

                    console.error(
                        "메시지 출력 오류:",
                        error
                    );
                }
            }


            // ====================================
            // 4. Enter 키 이벤트
            // ====================================
            chatMsg.addEventListener("keydown", function(event) {

                if (event.key === "Enter") {

                    event.preventDefault();

                    sendMessage();
                }
            });


            // ====================================
            // 5. 최초 연결 시작
            // ====================================
            connect();


            // ====================================
            // 6. 페이지 종료 시 연결 해제
            // ====================================
            window.addEventListener("beforeunload", function() {

                try {

                    if (stompClient && stompClient.connected) {

                        stompClient.disconnect();
                    }

                } catch(error) {

                    console.error(
                        "연결 종료 오류:",
                        error
                    );
                }
            });

        });

    </script>


</th:block>

</html>
