<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Taskwaka - 관리자 콘솔 (ADMIN)</title>


<th:block>
	<link rel="stylesheet" th:href="@{/dist/css/admin/admin-common.css}">
	<link rel="stylesheet" th:href="@{/dist/css/admin/admin-user.css}">
	<link rel="stylesheet"
		th:href="@{/dist/css/admin/admin-user-detail.css}">
	<link rel="stylesheet" th:href="@{/dist/css/admin/admin-domain.css}">
</th:block>
</head>
<body>

	<header class="site-header">
		<div class="header-left">
			<a href="/admin" class="brand-logo"> <span
				class="brand-logo-badge">T</span> <span>Taskwaka</span>
			</a> <span class="admin-chip">System Admin</span>
		</div>
		<div class="header-right">
			<a href="/project?tab=feed" class="btn-nav-switch">🌿 프로젝트 워크스페이스</a>
			<div class="profile-dropdown">

				<button type="button" class="profile-btn" id="profileToggle"
					title="관리자">관리</button>

				<div class="profile-menu" id="profileMenu" hidden>
					<form th:action="@{/member/logout}" method="post">
						<button type="submit" class="logout-button">로그아웃</button>
					</form>
				</div>

			</div>
		</div>
	</header>

	<div class="app-frame">
		<aside class="sidebar">
			<div class="menu-group">
				<div class="menu-toggle">
					<span>계정 및 보안 관리</span> <span style="font-size: 10px;">▲</span>
				</div>
				<ul class="submenu">
					<li><a th:href="@{/admin(section='user')}"
						th:classappend="${activeSection == 'user'} ? 'active'">👤 전체
							회원 관리</a></li>
					<li><a th:href="@{/admin/domain}"
						th:classappend="${activeSection == 'domain'} ? 'active'">🌐
							도메인 접근 제한</a></li>
					<li><a th:href="@{/admin(section='security')}"
						th:classappend="${activeSection == 'security'} ? 'active'">🔒
							공개 설정 및 보안</a></li>
				</ul>
			</div>

			<div class="menu-group">
				<div class="menu-toggle">
					<span>운영 및 고객 지원</span> <span style="font-size: 10px;">▼</span>
				</div>
				<ul class="submenu">
					<li><a th:href="@{/admin/notice}"
						th:classappend="${activeSection == 'notice'} ? 'active'">📣 전체
							공지사항 관리</a></li>
					<li><a th:href="@{/admin(section='inquiry')}"
						th:classappend="${activeSection == 'inquiry'} ? 'active'">💬
							1:1 고객 문의 관리</a></li>
				</ul>
			</div>

			<div class="menu-group">
				<div class="menu-toggle">
					<span>통계 대시보드</span> <span style="font-size: 10px;">▼</span>
				</div>
				<ul class="submenu">
					<li><a th:href="@{/admin(section='stats')}"
						th:classappend="${activeSection == 'stats'} ? 'active'">📈 접속자
							및 결제 통계</a></li>
				</ul>
			</div>
		</aside>

		<main class="main-viewport">
			<div class="admin-header">
				<h2 class="admin-title-h2">
					<span>⚙️</span> <span>Taskwaka 시스템 관리자 콘솔</span>
				</h2>

				<nav class="tab-bar">
					<a th:href="@{/admin(section='user')}" class="tab-btn" th:classappend="${activeSection == 'user'} ? 'active'">회원 관리</a> 
					<a th:href="@{/admin/domain}" class="tab-btn" th:classappend="${activeSection == 'domain'} ? 'active'">도메인 관리</a> 
					<a th:href="@{/admin/notice}" class="tab-btn" th:classappend="${activeSection == 'notice'} ? 'active'">전체 공지사항</a>
					<a th:href="@{/admin(section='inquiry')}" class="tab-btn" th:classappend="${activeSection == 'inquiry'} ? 'active'">1:1 문의 답변</a> 
					<a th:href="@{/admin(section='stats')}" class="tab-btn" th:classappend="${activeSection == 'stats'} ? 'active'">통계 관리</a>
					<a th:href="@{/admin(section='security')}" class="tab-btn" th:classappend="${activeSection == 'security'} ? 'active'">보안 및 공개설정</a>
				</nav>
			</div>

			<section class="content-area">
				<div th:switch="${activeSection}">
					<div th:case="'user'">
						<div th:replace="~{admin/fragments/user :: content}"></div>
					</div>
					<div th:case="'userDetail'">
						<div th:replace="~{admin/fragments/user_detail :: content}"></div>
					</div>
					<div th:case="'domain'">
						<div th:replace="~{admin/fragments/domain :: content}"></div>
					</div>
					<div th:case="'notice'">
						<div th:replace="~{admin/fragments/notice :: content}"></div>
					</div>
					<div th:case="'noticeDetail'">
					    <div th:replace="~{admin/fragments/notice-detail :: content}"></div>
					</div>
					<div th:case="'inquiry'">
						<div th:replace="~{admin/fragments/inquiry :: content}"></div>
					</div>
					<div th:case="'stats'">
						<div th:replace="~{admin/fragments/stats :: content}"></div>
					</div>
					<div th:case="'security'">
						<div th:replace="~{admin/fragments/security :: content}"></div>
					</div>
				</div>
			</section>
		</main>
	</div>


	<script>
    const profileToggle = document.getElementById("profileToggle");
    const profileMenu = document.getElementById("profileMenu");

    if (profileToggle && profileMenu) {
        profileToggle.addEventListener("click", () => {
            profileMenu.hidden = !profileMenu.hidden;
        });

        document.addEventListener("click", e => {
            if (!e.target.closest(".profile-dropdown")) {
                profileMenu.hidden = true;
            }
        });
    }
</script>

	<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>


	<script th:if="${activeSection == 'domain'}">
    const { createApp } = Vue;

    createApp({
    	data: function() {
    	    return {
    	        workspaces: [],
    	        pmChanges: [],
    	        workspacePage: 1,
    	        workspacePageSize: 5,
    	        pmPage: 1,
    	        pmPageSize: 5,
    	        keyword: '',
    	        status: '',
    	        selectedWorkspace: null,
    	        stopReason: ''
    	    };
    	},
    	
    	computed: {
    	    filteredWorkspaces: function() {
    	        return this.workspaces.filter(workspace => {
    	        	const keywordMatch =
    	        	    (workspace.subject || '').toLowerCase().includes(this.keyword.toLowerCase())
    	        	    || (workspace.domain_key || '').toLowerCase().includes(this.keyword.toLowerCase())
    	        	    || (workspace.pm_name || '').toLowerCase().includes(this.keyword.toLowerCase());

    	            const statusMatch =
    	                this.status === '' || workspace.active === this.status;

    	            return keywordMatch && statusMatch;
    	        });
    	    },
    	    pagedWorkspaces: function() {
    	        const start = (this.workspacePage - 1) * this.workspacePageSize;

    	        return this.filteredWorkspaces.slice(
    	            start,
    	            start + this.workspacePageSize
    	        );
    	    },

    	    workspaceTotalPages: function() {
    	        return Math.ceil(
    	            this.filteredWorkspaces.length / this.workspacePageSize
    	        );
    	    },
    	    pagedPmChanges: function() {
    	        const start = (this.pmPage - 1) * this.pmPageSize;

    	        return this.pmChanges.slice(
    	            start,
    	            start + this.pmPageSize
    	        );
    	    },

    	    pmTotalPages: function() {
    	        return Math.ceil(
    	            this.pmChanges.length / this.pmPageSize
    	        );
    	    }
    	},
    	
    	watch: {
    	    keyword: function() {
    	        this.workspacePage = 1;
    	    },

    	    status: function() {
    	        this.workspacePage = 1;
    	    }
    	},
    	
    	methods: {
    	    showDetail: function(workspace) {
    	        this.selectedWorkspace = workspace;
    	    },

    	    closeDetail: function() {
    	        this.selectedWorkspace = null;
    	    },
    	    
    	    changeWorkspaceStatus: function(active) {

    	        if (active === 'N' && !this.stopReason.trim()) {
    	            alert('정지 사유를 입력해주세요.');
    	            return;
    	        }

    	        if (!confirm(active === 'N'
    	                ? '이 워크를 정지하시겠습니까?'
    	                : '이 워크의 정지를 해제하시겠습니까?')) {
    	            return;
    	        }

    	        const dto = {
    	            workspace_id: this.selectedWorkspace.workspace_id,
    	            active: active,
    	            reason: active === 'N' ? this.stopReason.trim() : null
    	        };

    	        fetch('/admin/api/workspaces/status', {
    	            method: 'POST',
    	            headers: {
    	                'Content-Type': 'application/json'
    	            },
    	            body: JSON.stringify(dto)
    	        })
    	        .then(response => {
    	            if (!response.ok) {
    	                throw new Error('워크 상태 변경 실패');
    	            }
    	            return response.text();
    	        })
    	        .then(data => {
    	            alert(data);
    	            location.reload();
    	        })
    	        .catch(error => {
    	            console.error(error);
    	            alert('워크 상태 변경 중 오류가 발생했습니다.');
    	        });
    	    },
    	    

    	    processPmChange: function(pm, status) {

    	        let rejectReason = null;

    	        if (status === 2) {
    	            rejectReason = prompt('거절 사유를 입력하세요.');

    	            if (rejectReason === null) {
    	                return;
    	            }

    	            if (!rejectReason.trim()) {
    	                alert('거절 사유를 입력해주세요.');
    	                return;
    	            }
    	        }

    	        if (!confirm(status === 1 ? 'PM 변경을 승인하시겠습니까?' : 'PM 변경을 거절하시겠습니까?')) {
    	            return;
    	        }

    	        const dto = {
    	            pm_change_id: pm.pm_change_id,
    	            status: status,
    	            reject_reason: rejectReason
    	        };

    	        fetch('/admin/api/pm-changes/process', {
    	            method: 'POST',
    	            headers: {
    	                'Content-Type': 'application/json'
    	            },
    	            body: JSON.stringify(dto)
    	        })
    	        .then(async response => {
			    const message = await response.text();
			
			    if (!response.ok) {
			        throw new Error(message);
			    }
			    return message;
			})
    	        .then(data => {
    	            alert(data);
    	            location.reload();
    	        })
    	        .catch(error => {
    	            console.error(error);
    	            alert(error.message);
    	        });
    	    }

    	},

        mounted: function() {
            fetch('/admin/api/workspaces')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('워크 목록 조회 실패');
                    }
                    return response.json();
                })
                .then(data => {
                    this.workspaces = data;
                })
                .catch(error => {
                    console.error(error);
                });

            fetch('/admin/api/pm-changes')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('PM 변경 요청 조회 실패');
                    }
                    return response.json();
                })
                .then(data => {
                    this.pmChanges = data;
                })
                .catch(error => {
                    console.error(error);
                });

        }
    }).mount('#workspace-app');
</script>



</body>
</html>
