<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Taskwaka - 관리자 콘솔 (ADMIN)</title>


<th:block>
	<link rel="stylesheet" th:href="@{/dist/css/admin/admin-common.css}">
	<link rel="stylesheet" th:href="@{/dist/css/admin/admin-user.css}">
	<link rel="stylesheet" th:href="@{/dist/css/admin/admin-user-detail.css}">
	<link rel="stylesheet" th:href="@{/dist/css/admin/admin-domain.css}">
	<link rel="stylesheet" th:href="@{/dist/css/admin/admin-stats.css}">
	<!-- Quill editor -->
	<link rel="stylesheet" th:if="${activeSection == 'noticeWrite' or activeSection == 'noticeDetail' or activeSection == 'noticeEdit'}"
	 	th:href="@{/dist/vendor/quill/css/quill.snow.css}">
	<link rel="stylesheet" th:if="${activeSection == 'noticeWrite' or activeSection == 'noticeDetail' or activeSection == 'noticeEdit'}"
	 	th:href="@{/dist/vendor/quill/css/resize.css}">
	 <link rel="stylesheet" th:href="@{/dist/css/admin/admin-notice.css}">	
</th:block>
</head>
<body>

	<header class="site-header">
		<div class="header-left">
			<a href="/admin" class="brand-logo"> <span
				class="brand-logo-badge">T</span> <span>Taskwaka</span>
			</a> <span class="admin-chip">System Admin</span>
		</div>
		<div class="header-right">
			<div class="profile-dropdown">

				<button type="button" class="profile-btn" id="profileToggle"
					title="관리자">관리</button>

				<div class="profile-menu" id="profileMenu" hidden>
					<form th:action="@{/member/logout}" method="post">
						<button type="submit" class="logout-button">로그아웃</button>
					</form>
				</div>

			</div>
		</div>
	</header>

	<div class="app-frame">
		<aside class="sidebar">
			<div class="menu-group">
				<div class="menu-toggle">
					<span>계정 및 보안 관리</span> <span style="font-size: 10px;">▲</span>
				</div>
				<ul class="submenu">
					<li><a th:href="@{/admin(section='user')}"
						th:classappend="${activeSection == 'user'} ? 'active'">👤 전체
							회원 관리</a></li>
					<li><a th:href="@{/admin/domain}"
						th:classappend="${activeSection == 'domain'} ? 'active'">🌐
							도메인 접근 제한</a></li>
					<li><a th:href="@{/admin(section='security')}"
						th:classappend="${activeSection == 'security'} ? 'active'">🔒
							공개 설정 및 보안</a></li>
				</ul>
			</div>

			<div class="menu-group">
				<div class="menu-toggle">
					<span>운영 및 고객 지원</span> <span style="font-size: 10px;">▼</span>
				</div>
				<ul class="submenu">
					<li><a th:href="@{/admin/notice}"
						th:classappend="${activeSection == 'notice'} ? 'active'">📣 전체 공지사항 관리</a>
					</li>
					<li><a th:href="@{/admin/inquiry}"
						th:classappend="${activeSection == 'inquiry'} ? 'active'">💬 1:1 고객 문의 관리</a>
					</li>
					<li>
					    <a th:href="@{/admin/faq}" th:classappend="${activeSection == 'faq'} ? 'active'">🤖 FAQ 관리</a>
					</li>		
				</ul>
			</div>

			<div class="menu-group">
				<div class="menu-toggle">
					<span>통계 대시보드</span> <span style="font-size: 10px;">▼</span>
				</div>
				<ul class="submenu">
					<li><a th:href="@{/admin(section='stats')}"
						th:classappend="${activeSection == 'stats'} ? 'active'">📈 접속자
							및 결제 통계</a></li>
				</ul>
			</div>
		</aside>

		<main class="main-viewport">
			<div class="admin-header">
				<h2 class="admin-title-h2">
					<span>⚙️</span> <span>Taskwaka 시스템 관리자 콘솔</span>
				</h2>

				<nav class="tab-bar">
					<a th:href="@{/admin/user}" class="tab-btn" th:classappend="${activeSection == 'user'} ? 'active'">회원 관리</a> 
					<a th:href="@{/admin/domain}" class="tab-btn" th:classappend="${activeSection == 'domain'} ? 'active'">도메인 관리</a> 
					<a th:href="@{/admin/notice}" class="tab-btn" th:classappend="${activeSection == 'notice'} ? 'active'">전체 공지사항</a>
					<a th:href="@{/admin/inquiry}" class="tab-btn" th:classappend="${activeSection == 'inquiry'} ? 'active'">1:1 문의 답변</a> 
					<a th:href="@{/admin/faq}" class="tab-btn" th:classappend="${activeSection == 'faq' or activeSection == 'faqWrite'} ? 'active'">FAQ 관리</a>
					<a th:href="@{/admin/stats}" class="tab-btn" th:classappend="${activeSection == 'stats'} ? 'active'">통계 관리</a>
					<a th:href="@{/admin/security}" class="tab-btn" th:classappend="${activeSection == 'security'} ? 'active'">보안 및 공개설정</a>
				</nav>
			</div>

			<section class="content-area">
				<div th:switch="${activeSection}">
					<div th:case="'user'">
						<div th:replace="~{admin/fragments/user :: content}"></div>
					</div>
					<div th:case="'userDetail'">
						<div th:replace="~{admin/fragments/user_detail :: content}"></div>
					</div>
					<div th:case="'domain'">
						<div th:replace="~{admin/fragments/domain :: content}"></div>
					</div>
					<div th:case="'notice'">
						<div th:replace="~{admin/fragments/notice :: content}"></div>
					</div>
					<div th:case="'noticeWrite'">
					     <div th:replace="~{admin/fragments/notice-write :: content}"></div>
					</div>
					<div th:case="'noticeDetail'">
					    <div th:replace="~{admin/fragments/notice-detail :: content}"></div>
					</div>
					<div th:case="'noticeEdit'">
					    <div th:replace="~{admin/fragments/notice-edit :: content}"></div>
					</div>
					<div th:case="'inquiry'">
						<div th:replace="~{admin/fragments/inquiry :: content}"></div>
					</div>
					<div th:case="'inquiryDetail'">
						<div th:replace="~{admin/fragments/inquiry-detail :: content}"></div>
					</div>
					<div th:case="'faq'">
						<div th:replace="~{admin/fragments/faq :: content}"></div>
					</div>
					<div th:case="'faqWrite'">
					    <div th:replace="~{admin/fragments/faq-write :: content}"></div>
					</div>
					<div th:case="'faqEdit'">
						<div th:replace="~{admin/fragments/faq-edit :: content}"></div>
					</div>
					<div th:case="'stats'">
						<div th:replace="~{admin/fragments/stats :: content}"></div>
					</div>
					<div th:case="'security'">
						<div th:replace="~{admin/fragments/security :: content}"></div>
					</div>
				</div>
			</section>
		</main>
	</div>


	<script>
    const profileToggle = document.getElementById("profileToggle");
    const profileMenu = document.getElementById("profileMenu");

    if (profileToggle && profileMenu) {
        profileToggle.addEventListener("click", () => {
            profileMenu.hidden = !profileMenu.hidden;
        });

        document.addEventListener("click", e => {
            if (!e.target.closest(".profile-dropdown")) {
                profileMenu.hidden = true;
            }
        });
    }
</script>

	<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>


	

<!-- Quill editor -->
<script th:if="${activeSection == 'noticeWrite' or activeSection == 'noticeEdit'}" th:src="@{/dist/vendor/quill/js/quill.js}"></script>
<script th:if="${activeSection == 'noticeWrite' or activeSection == 'noticeEdit'}" th:src="@{/dist/vendor/quill/js/resize.js}"></script>
<script th:if="${activeSection == 'noticeWrite' or activeSection == 'noticeEdit'}" th:src="@{/dist/posts/qeditor.js}"></script>
<!-- 관리자 수익 통계 Chart.js -->
<script th:if="${activeSection == 'stats'}" src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:if="${activeSection == 'stats'}" th:src="@{/dist/js/adminStatsChart.js}"></script>

<th:block th:if="${activeSection == 'noticeWrite'}"><th:block th:replace="~{admin/fragments/notice-write :: script}"></th:block></th:block>
<th:block th:if="${activeSection == 'noticeEdit'}" th:replace="~{admin/fragments/notice-edit :: script}"></th:block>	
<th:block th:if="${activeSection == 'domain'}" th:replace="~{admin/fragments/domain :: script}"></th:block>
<script th:if="${activeSection == 'inquiryDetail'}" th:replace="~{admin/fragments/inquiry-detail :: script}"></script>
<th:block th:if="${activeSection == 'inquiry'}" th:replace="~{admin/fragments/inquiry :: script}"></th:block>
<th:block th:if="${activeSection == 'faqWrite'}"><th:block th:replace="~{admin/fragments/faq-write :: script}"></th:block></th:block>
<th:block th:if="${activeSection == 'faqEdit'}"><th:block th:replace="~{admin/fragments/faq-edit :: script}"></th:block></th:block>
</body>
</html>
