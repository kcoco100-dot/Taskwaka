<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content">
    <div class="panel-card">
        <div class="panel-card-title">FAQ 관리</div>
        
        <div class="faq-list-actions">
		    <a th:href="@{/admin/faq/write}" class="btn-sage">FAQ 등록</a>
		</div>

        <table class="warm-table faq-table">
            <thead>
                <tr>
                    <th>번호</th>
                    <th>질문</th>
                    <th>답변</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody>
			    <tr th:each="faq : ${faqList}">
			        <td th:text="${faq.faqId}"></td>
			        <td th:text="${faq.question}"></td>
			        <td th:text="${faq.answer}"></td>
			        <td>
			            <a th:href="@{/admin/faq/edit(faqId=${faq.faqId})}" class="btn-sage">수정</a>
			
			            <form th:action="@{/admin/faq/delete}" method="post" style="display:inline;">
			                <input type="hidden" name="faqId" th:value="${faq.faqId}">
			                <button type="submit" class="btn-faq-delete" onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
			            </form>
			        </td>
			    </tr>
			</tbody>
        </table>
    </div>
</div>

</body>
</html>
