<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<div th:fragment="content">
	    <h2 th:text="${detail.title}"></h2>
	    <p th:text="${detail.content}"></p>
	    <p th:text="${detail.member_id}"></p>
	    <p th:text="${#dates.format(detail.created, 'yyyy-MM-dd HH:mm')}"></p>
	    <p th:text="${detail.updated != null ? #dates.format(detail.updated, 'yyyy-MM-dd HH:mm') : '수정 전'}"></p>
	    <p th:text="${detail.status == 1 ? '공개' : '비공개'}"></p>
	
	<form th:action="@{/admin/notice/update}" method="post">
	    <input type="hidden" name="notice_id" th:value="${detail.notice_id}">
	    <input type="text" name="title" th:value="${detail.title}">
	    <textarea name="content" th:text="${detail.content}"></textarea>
		<label>
		    <input type="checkbox" name="hideNotice" value="true" th:checked="${detail.status == 0}">
		    비공개 (체크하면 숨기기)
		</label>
		<button type="submit">수정하기</button>
	</form>
	</div>

</body>
</html>
