<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">

    <div class="panel-card">
        <div class="panel-card-title">
            <span>접속자 통계 조회 (중복 제거 회원 수 &amp; 로그인 성공 건수)</span>
            <div class="stats-period-buttons">
                <a class="btn-subtle" href="/admin/stats?period=daily" th:classappend="${period == 'daily'} ? 'stats-period-active'">일별</a>
                <a class="btn-subtle" href="/admin/stats?period=weekly" th:classappend="${period == 'weekly'} ? 'stats-period-active'">주별</a>
                <a class="btn-subtle" href="/admin/stats?period=monthly" th:classappend="${period == 'monthly'} ? 'stats-period-active'">월별</a>
                <a class="btn-subtle" href="/admin/stats?period=yearly" th:classappend="${period == 'yearly'} ? 'stats-period-active'">연간</a>
            </div>
        </div>

        <div class="stats-summary-grid">
            <div class="stats-summary-card">
			    <div class="stats-summary-label">조회 기간</div>
			    <div class="stats-summary-period" th:text="${period == 'yearly' ? yearPeriod : (period == 'monthly' ? monthPeriod : (period == 'weekly' ? weekPeriod : today))}">조회 기간</div>
			</div>

            <div class="stats-summary-card">
                <div class="stats-summary-label">접속 회원 수 (중복 제외)</div>
                <div class="stats-summary-value stats-member-count"><span th:text="${memberCount}">0</span> 명</div>
            </div>

            <div class="stats-summary-card">
                <div class="stats-summary-label">로그인 성공 횟수 (전체 누적)</div>
                <div class="stats-summary-value"><span th:text="${loginCount}">0</span> 건</div>
            </div>
        </div>
    </div>

    <div class="panel-card">
        <div class="panel-card-title">
            <span>전체 수익 통계 조회 (결제 및 환불 집계 현황)</span>
            <span class="stats-revenue-note">* 순결제 금액 = 결제 완료 금액 - 환불 완료 금액</span>
        </div>

        <table class="warm-table">
            <thead>
                <tr>
                    <th>조회 기간</th>
                    <th>결제 건수</th>
                    <th>결제 완료 금액</th>
                    <th>환불 완료 금액</th>
                    <th>순결제 금액</th>
                </tr>
            </thead>
            <tbody>
                <tr>
				    <td><strong>전체 누적 실적</strong></td>
				    <td><span th:text="${paymentCount}">0</span> 건</td>
				    <td>₩ <span th:text="${#numbers.formatInteger(paymentAmount, 3, 'COMMA')}">0</span></td>
				    <td>₩ <span th:text="${#numbers.formatInteger(refundAmount, 3, 'COMMA')}">0</span></td>
				    <td><strong class="stats-net-revenue">₩ <span th:text="${#numbers.formatInteger(netAmount, 3, 'COMMA')}">0</span></strong></td>
				</tr>
                <tr>
				    <td><strong th:text="${#temporals.format(today, 'yyyy년 MM월')} + ' (당월 실적)'">이번 달 실적</strong></td>
				    <td><span th:text="${monthPaymentCount}">0</span> 건</td>
				    <td>₩ <span th:text="${#numbers.formatInteger(monthPaymentAmount, 3, 'COMMA')}">0</span></td>
				    <td>₩ <span th:text="${#numbers.formatInteger(monthRefundAmount, 3, 'COMMA')}">0</span></td>
				    <td><strong class="stats-net-revenue">₩ <span th:text="${#numbers.formatInteger(monthNetAmount, 3, 'COMMA')}">0</span></strong></td>
				</tr>
				<tr>
				    <td><strong th:text="${quarterPeriod}">이번 분기 실적</strong></td>
				    <td><span th:text="${quarterPaymentCount}">0</span> 건</td>
				    <td>₩ <span th:text="${#numbers.formatInteger(quarterPaymentAmount, 3, 'COMMA')}">0</span></td>
				    <td>₩ <span th:text="${#numbers.formatInteger(quarterRefundAmount, 3, 'COMMA')}">0</span></td>
				    <td><strong class="stats-net-revenue">₩ <span th:text="${#numbers.formatInteger(quarterNetAmount, 3, 'COMMA')}">0</span></strong></td>
				</tr>
            </tbody>
        </table>
        <div class="stats-chart-section">
		    <h3>최근 6개월 순결제 금액 추이</h3>
		    <div style="height: 300px;">
		        <canvas id="monthlyRevenueChart" th:attr="data-months=${#strings.listJoin(monthlyRevenueList.![month], ',')}, data-amounts=${#strings.listJoin(monthlyRevenueList.![net_amount], ',')}"></canvas>
		    </div>
		</div>
    </div>

</div>
</body>
</html>
