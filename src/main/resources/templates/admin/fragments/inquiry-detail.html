<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="content">
        <div class="panel-card">

            <div class="panel-card-title">
                <span>1:1 고객 문의 상세 및 답변 관리</span>
                <a th:href="@{/admin/inquiry}" class="btn-subtle">목록으로</a>
            </div>

            <div style="padding:20px 0;">
                <h3 th:text="${inquiryDetail.title}">문의 제목</h3>

                <p style="color:var(--text-sub); font-size:13px;">
                    문의번호: <span th:text="${inquiryDetail.inquiry_id}">1</span>
                    |
                    작성자 번호: <span th:text="${inquiryDetail.member_id}">7</span>
                    |
                    작성일: <span th:text="${#dates.format(inquiryDetail.created, 'yyyy-MM-dd HH:mm')}"></span>
                </p>

                <hr>

                <h4>문의 내용</h4>
                <div style="min-height:150px; white-space:pre-wrap;" th:text="${inquiryDetail.content}">문의 내용</div>
            </div>

            <div style="border-top:1px solid #eee; padding-top:20px;">
                <h4>관리자 답변</h4>

                <form th:action="@{/admin/inquiry/answer}" method="post">
                    <input type="hidden" name="inquiry_id" th:value="${inquiryDetail.inquiry_id}">

                    <textarea name="answer_content" class="warm-input" rows="6" style="width:100%; resize:vertical;" th:text="${inquiryDetail.answer_content}" placeholder="답변 내용을 입력하세요."></textarea>

                    <div style="text-align:right; margin-top:15px;">
                        <button type="submit" class="btn-sage" th:text="${inquiryDetail.status == 1 ? '답변 수정' : '답변 등록'}">답변 등록</button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</body>
</html>
