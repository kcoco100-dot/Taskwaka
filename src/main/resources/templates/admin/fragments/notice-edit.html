<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<div th:fragment="content" class="notice-form-page">
		<div class="panel-card">

			<div class="panel-card-title">공지사항 수정</div>

			<form id="noticeEditForm" th:action="@{/admin/notice/update}" method="post">

				<input type="hidden" name="notice_id" th:value="${detail.notice_id}">

				<div class="notice-form-row">
					<div class="notice-field">
						<label>공지 제목 *</label> <input type="text" name="title" class="warm-input" th:value="${detail.title}" required>
					</div>

					<div class="notice-field">
						<label>공개 여부</label> <label class="notice-checkbox"> <input
							type="checkbox" name="hideNotice" value="true" th:checked="${detail.status == 0}"> 비공개
						</label>
					</div>
				</div>

				<div class="notice-field">
					<label>공지 내용 *</label>
					<div id="editor"></div>
					<input type="hidden" name="content" id="content">
					<textarea id="originalContent" hidden th:text="${detail.content}"></textarea>
				</div>

				<div class="notice-form-actions">
					<a th:href="@{/admin/notice/{id}(id=${detail.notice_id})}" class="notice-list-btn">취소</a>
					<button type="submit" class="btn-sage">수정 완료</button>
				</div>

			</form>
		</div>
	</div>
</body>
</html>
