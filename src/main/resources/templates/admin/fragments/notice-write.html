<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<div th:fragment="content" class="notice-form-page">
		<div class="panel-card">

			<div class="panel-card-title">공지사항 등록</div>

			<form id="noticeWriteForm" th:action="@{/admin/notice}" method="post" enctype="multipart/form-data">

				<div class="notice-form-row">
					<div class="notice-field">
						<label>공지 제목 *</label> <input type="text" name="title" class="warm-input" placeholder="공지사항 제목을 입력하세요" required>
					</div>

					<div class="notice-field">
						<label>공개 여부 *</label> <select name="status" class="warm-select">
							<option value="1">공개</option>
							<option value="0">비공개</option>
						</select>
					</div>
				</div>

				<div class="notice-field">
					<label>공지 내용 *</label>
					<div id="editor"></div>
					<input type="hidden" name="content" id="content">
				</div>
				
				<div class="notice-field">
					<label>첨부파일</label>
					<input type="file" name="files" multiple>
				</div>

				<div class="notice-form-actions">
					<a th:href="@{/admin/notice}" class="notice-list-btn">취소</a>
					<button type="submit" class="btn-sage">공지사항 등록</button>
				</div>

			</form>
		</div>
	</div>
</body>
</html>
