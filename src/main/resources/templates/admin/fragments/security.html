<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
  <div th:fragment="content">
    <div class="panel-card">
      <div class="panel-card-title">중복 로그인 제한 설정 (세션 보안 관리)</div>
      <p style="font-size:13px; color:var(--text-sub); margin-bottom:16px; line-height:1.6;">
        동일 계정의 다중 접속 정책을 설정합니다. 제한이 활성화된 경우 다른 기기나 브라우저에서 새롭게 로그인하면 기존 로그인 세션이 즉시 만료되어 로그아웃 처리됩니다.
      </p>

      <form onsubmit="event.preventDefault(); alert('보안 및 공개 설정이 저장되었습니다.');">
        <div style="padding:16px; border:1px solid var(--border-main); border-radius:10px; background:var(--bg-card-sub); margin-bottom:16px;">
          <div style="margin-bottom:12px;">
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13.5px; font-weight:700; color:var(--text-main);">
              <input type="radio" name="dup_login" value="ENABLE" checked>
              <span>중복 로그인 제한 활성화 (권장)</span>
            </label>
            <p style="margin-left:24px; font-size:12px; color:var(--text-sub); margin-top:2px;">
              하나의 브라우저에서만 로그인 가능하며, 새로운 브라우저에서 로그인 시 기존 브라우저는 자동 로그아웃됩니다.
            </p>
          </div>

          <div>
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13.5px; font-weight:700; color:var(--text-main);">
              <input type="radio" name="dup_login" value="DISABLE">
              <span>중복 로그인 제한 비활성화</span>
            </label>
            <p style="margin-left:24px; font-size:12px; color:var(--text-sub); margin-top:2px;">
              동일 계정으로 모바일, PC 등 여러 기기 및 브라우저에서 동시 로그인을 허용합니다.
            </p>
          </div>
        </div>

        <div style="text-align:right;">
          <button type="submit" class="btn-sage">설정 저장하기</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
