<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TASKWAKA</title>
  
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Raleway:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Nunito:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap">
  
<!-- Vendor CSS Files -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
<link rel="stylesheet" th:href="@{/dist/vendor/perfect-scrollbar/perfect-scrollbar.css}" type="text/css">

<!-- Core CSS Files -->
<link rel="stylesheet" th:href="@{/dist/css/core.css}" type="text/css">
<!-- Main CSS Files -->
<link rel="stylesheet" th:href="@{/dist/css/main.css}" type="text/css">
<!-- Form CSS Files -->
<link rel="stylesheet" th:href="@{/dist/css/forms.css}" type="text/css">
<!-- chatbot -->
<link rel="stylesheet" th:href="@{/dist/css/faq-chatbots.css}">
<!-- dashboard CSS Files -->
<link rel="stylesheet" th:href="@{/dist/css/dashboard.css}">
<!-- projects CSS Files -->
<link rel="stylesheet" th:href="@{/dist/css/projects.css}">

<link rel="stylesheet" th:href="@{/dist/css/project/layout.css}">
<th:block th:replace="~{layout/header :: headerFooterAssets}"></th:block>
<link rel="stylesheet" th:href="@{/dist/css/sidebar.css}">
<link rel="stylesheet" th:if="${activeTab != 'notice'}" th:href="@{/dist/css/project/task-dialogs.css}">
</head>
<body>

	<!-- 상단 사이트 헤더 -->
	<header class="site-header">
		<div th:replace="~{layout/header:: header}"></div>
	</header>

	<div class="app-frame">
		<!-- 좌측 사이드바 -->
		<nav class="sidebar tw-sidebar" aria-label="프로젝트 메뉴">
		    <div class="tw-nav-groups">
		        <details class="tw-nav-group" open>
		            <summary th:replace="~{layout/sidebarUi :: heading('🗂️', '모아보기')}"></summary>
		            <ul class="tw-nav-items">
		                <li>
		                    <a th:href="@{/{domainKey}/project/{projectId}(domainKey=${domainKey}, projectId=${projectId}, tab='dashboard')}"
		                       th:attr="aria-current=${activeTab == 'dashboard' ? 'page' : null}">
		                        <th:block th:replace="~{layout/sidebarUi :: label('📚', '대시보드')}"></th:block>
		                    </a>
		                </li>
		                <li>
		                    <a th:href="@{/{domainKey}/project/{projectId}(domainKey=${domainKey}, projectId=${projectId}, tab='task')}"
		                       th:attr="aria-current=${activeTab == 'task' ? 'page' : null}">
		                        <th:block th:replace="~{layout/sidebarUi :: label('📋', '전체 업무')}"></th:block>
		                    </a>
		                </li>
		                <li>
		                    <a th:href="@{/{domainKey}/project/{projectId}(domainKey=${domainKey}, projectId=${projectId}, tab='gantt')}"
		                       th:attr="aria-current=${activeTab == 'gantt' ? 'page' : null}">
		                        <th:block th:replace="~{layout/sidebarUi :: label('📉', '간트차트')}"></th:block>
		                    </a>
		                </li>
		                <li>
		                    <a th:href="@{/{domainKey}/project/{projectId}(domainKey=${domainKey}, projectId=${projectId}, tab='calendar')}"
		                       th:attr="aria-current=${activeTab == 'calendar' ? 'page' : null}">
		                        <th:block th:replace="~{layout/sidebarUi :: label('🗓️', '캘린더')}"></th:block>
		                    </a>
		                </li>
		                <li>
		                    <a th:href="@{/{domainKey}/project/{projectId}(domainKey=${domainKey}, projectId=${projectId}, tab='notice')}"
		                       th:attr="aria-current=${activeTab == 'notice' ? 'page' : null}">
		                        <th:block th:replace="~{layout/sidebarUi :: label('📢', '업무 공지')}"></th:block>
		                    </a>
		                </li>
		            </ul>
		        </details>
		        <a th:replace="~{layout/sidebarUi :: back}"></a>
		    </div>
		</nav>

		<!-- 우측 메인 뷰포트 -->
		<main class="main-viewport">
			<div class="project-header">
				<h2 class="project-title-h2">
					<span th:text="${projectName}"></span>
				</h2>

				<!-- 상단 탭 네비게이션 바 -->
				<nav class="tab-bar">
					<a
						th:href="@{/{domainKey}/project/{projectId}(domainKey=${domainKey}, projectId=${projectId}, tab='dashboard')}"
						class="tab-btn" th:classappend="${activeTab == 'dashboard'} ? 'active'">대시보드</a>

					<a
						th:href="@{/{domainKey}/project/{projectId}(domainKey=${domainKey}, projectId=${projectId}, tab='task')}"
						class="tab-btn" th:classappend="${activeTab == 'task'} ? 'active'">업무</a>

					<a
						th:href="@{/{domainKey}/project/{projectId}(domainKey=${domainKey}, projectId=${projectId}, tab='gantt')}"
						class="tab-btn"
						th:classappend="${activeTab == 'gantt'} ? 'active'">간트차트</a> 
					<a
						th:href="@{/{domainKey}/project/{projectId}(domainKey=${domainKey}, projectId=${projectId}, tab='calendar')}"
						class="tab-btn"
						th:classappend="${activeTab == 'calendar'} ? 'active'">캘린더</a>
					<a
						th:href="@{/{domainKey}/project/{projectId}(domainKey=${domainKey}, projectId=${projectId}, tab='notice')}"
						class="tab-btn" th:classappend="${activeTab == 'notice'} ? 'active'">업무 공지</a>
				</nav>
			</div>

			<!-- 동적 탭 본문 렌더링 영역 -->
			<section class="content-area">
				<div th:switch="${activeTab}">
					<div th:case="'dashboard'">
						<div th:replace="~{project/fragments/dashboard :: content}"></div>
					</div>
					<div th:case="'task'">
						<div th:replace="~{project/fragments/task :: content}"></div>
					</div>
					<div th:case="'gantt'">
						<div th:replace="~{project/fragments/gantt :: content}"></div>
					</div>
					<div th:case="'calendar'">
						<div th:replace="~{project/fragments/calendar :: content}"></div>
					</div>
					
					<div th:case="'notice'">
						<div th:replace="~{project/fragments/notice :: content}"></div>
					</div>
				</div>
			</section>
		</main>
	</div>
	
	<div class="project-task-dialogs" th:if="${activeTab != 'notice'}">
		<div th:replace="~{project/fragments/task_items :: taskCreateModal}"></div>
		<th:block th:if="${activeTab == 'task'}">
			<div th:replace="~{project/fragments/task_items :: reportSubmitModal}"></div>
		</th:block>

		<!-- 삭제 확인 모달 -->
		<div class="custom-modal-backdrop" id="deleteConfirmModal" onclick="handleBackdropClick(event)">
			<div class="custom-modal-card">
				<div class="modal-header-area">
					<div class="modal-icon-badge">⚠️</div>
					<div class="modal-title-group">
						<div class="modal-main-title" id="modalTargetTitle">하위업무 삭제 확인</div>
						<div class="modal-desc-text" id="modalDescNotice">선택한 하위업무를 영구 삭제하시겠습니까?</div>
					</div>
				</div>
				<div class="modal-actions-area">
					<button type="button" class="btn-modal-cancel" onclick="closeDeleteModal()">취소</button>
					<button type="button" class="btn-modal-confirm" onclick="executeConfirmedDelete()">삭제하기</button>
				</div>
			</div>
		</div>
		<script th:src="@{/dist/js/project/task.js}"></script>
	</div>

	<footer>
		<div th:replace="~{layout/footer:: footer}"></div>
	</footer>

</body>
</html>
