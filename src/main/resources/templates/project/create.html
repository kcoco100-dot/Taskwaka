<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout3}">

<th:block layout:fragment="css">
    <link rel="stylesheet" th:href="@{/dist/manage/project-create.css}">
</th:block>

<th:block layout:fragment="content">
    <div class="project-create-page">
        <div class="project-create-card">
            <div class="project-create-heading">
                <h1>프로젝트 등록</h1>
                <p>새로운 프로젝트를 등록해보세요.</p>
            </div>

            <form class="project-create-form">
                <div class="project-field">
                    <label for="project-name">프로젝트명</label>
                    <input type="text" id="project-name"
                           placeholder="프로젝트명을 입력하세요">
                </div>

                <div class="project-field">
                    <label for="project-description">프로젝트 설명</label>
                    <textarea id="project-description" rows="4"
                              placeholder="프로젝트 설명을 입력하세요"></textarea>
                </div>

                <div class="project-date-row">
                    <div class="project-field">
                        <label for="start-date">시작일</label>
                        <input type="date" id="start-date">
                    </div>

                    <div class="project-field">
                        <label for="end-date">종료일</label>
                        <input type="date" id="end-date">
                    </div>
                </div>

                <div class="project-create-actions">
                    <button type="button" class="project-save">등록하기</button>
                    <a th:href="@{/manage}" class="project-cancel">취소</a>
                </div>
            </form>
        </div>
    </div>
</th:block>

<th:block layout:fragment="script"></th:block>

</html>
