<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
  <div th:fragment="content">
    <style>
      .gantt-board { background: #FFFFFF; border: 1px solid var(--border-main); border-radius: 14px; overflow: hidden; display: flex; box-shadow: 0 2px 8px rgba(89, 67, 49, 0.03); }
      .gantt-tasks { width: 320px; border-right: 1px solid var(--border-main); background: #FFFFFF; }
      .gantt-row-head { height: 44px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border-main); padding: 12px 16px; font-size: 13px; font-weight: 700; color: var(--text-main); }
      .gantt-row { height: 44px; border-bottom: 1px solid var(--border-main); padding: 12px 16px; font-size: 13px; color: var(--text-main); display: flex; align-items: center; }
      .gantt-canvas { flex: 1; overflow-x: auto; }
      .gantt-timeline-header { height: 44px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border-main); display: flex; }
      .day-col { width: 100px; padding: 12px 10px; font-size: 12px; color: var(--text-sub); border-right: 1px solid var(--border-main); text-align: center; }
      .day-col.today { background: var(--primary-green-light); color: var(--primary-green); font-weight: 700; }
      .timeline-track { height: 44px; border-bottom: 1px solid var(--border-main); position: relative; display: flex; align-items: center; }
      .gantt-bar-item { position: absolute; height: 18px; border-radius: 6px; font-size: 11px; font-weight: 600; color: #FFFFFF; display: flex; align-items: center; padding-left: 8px; }
    </style>

    <div class="gantt-board">
      <div class="gantt-tasks">
        <div class="gantt-row-head">업무명</div>
        <div class="gantt-row">Taskwaka 사용 가이드 영상 🎬</div>
        <div class="gantt-row">프로필 사진 등록 👩‍💼</div>
      </div>

      <div class="gantt-canvas">
        <div style="width: 600px;">
          <div class="gantt-timeline-header">
            <div class="day-col">09-30</div>
            <div class="day-col today">10-01 (오늘)</div>
            <div class="day-col">10-02</div>
            <div class="day-col">10-03</div>
          </div>
          <div class="timeline-track">
            <div class="gantt-bar-item" style="left: 10px; width: 180px; background: var(--accent-green);">진행중 (50%)</div>
          </div>
          <div class="timeline-track">
            <div class="gantt-bar-item" style="left: 100px; width: 140px; background: var(--primary-green-dark);">완료</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
