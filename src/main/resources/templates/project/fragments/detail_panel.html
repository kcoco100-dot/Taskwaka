<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
	<!-- ==========================================================================
	     [공통 프래그먼트] 우측 오버레이 상세 패널 (업무 탭 / 간트차트 탭 / 캘린더 탭 공용)
	     사용법: <aside th:replace="~{project/fragments/detail_panel :: detailPanel}"></aside>
	     ========================================================================== -->
	<aside th:fragment="detailPanel" class="common-detail-panel" id="taskDetailSidePanel" th:attr="data-current-project-member-id =${currentProjectMemberId}">
		<link rel="stylesheet" th:href="@{/dist/css/project/detail_panel.css}">

		<div class="pane-resizer-bar" id="paneResizerBar" title="좌우로 드래그하여 패널 너비 조절"></div>

		<!-- 본문 스크롤 영역 (상단 네비게이션 바 제거 완료) -->
		<div class="detail-content-scroll">
			<!-- 담당자 메타 헤더 & 우측 액션 툴바 통합 -->
			<div class="detail-meta-header">
				<div class="detail-author-box">
					<div class="detail-avatar-badge" id="detailAuthorAvatar">담당</div>
					<div>
						<div style="display:flex; align-items:center; gap:6px;">
							<span class="detail-author-name" id="detailAuthorName">-</span>
							<span class="detail-type-chip" id="detailEntityTypeBadge">메인 업무</span>
						</div>
						<span class="detail-created-date" id="detailCreatedDate">-</span>
					</div>
				</div>

				<!-- 우측 상단 컨트롤 버튼 영역 -->
				<div class="detail-header-tools">
					<!-- [조회 모드] 하위업무일 때 노출되는 수정/삭제 버튼 -->
					<button type="button" class="btn-detail-action-edit" id="btnDetailEditMode" style="display:none;" onclick="enterDetailEditMode()" title="내용 수정">수정</button>
					<button type="button" class="btn-detail-top-del" id="btnDetailDeleteSubtask" style="display:none;" onclick="requestDeleteCurrentSubTask()" title="하위업무 삭제">삭제</button>

					<!-- [수정 모드] 수정 버튼 클릭 시 전환되는 저장/취소 버튼 -->
					<button type="button" class="btn-detail-action-save" id="btnDetailSaveEdit" style="display:none;" onclick="saveDetailEditMode()">저장</button>
					<button type="button" class="btn-detail-action-cancel" id="btnDetailCancelEdit" style="display:none;" onclick="cancelDetailEditMode()">취소</button>

					<button type="button" class="detail-close-btn" onclick="closeDetailPanel()" title="닫기 (ESC)">✕</button>
				</div>
			</div>

			<!-- 업무/하위업무 제목 (평소엔 텍스트처럼 표시, 수정 모드 시 테두리 활성) -->
			<div class="detail-title-row">
				<input type="text" class="detail-task-title-input" id="detailTaskTitle" value="" placeholder="제목을 입력하세요" readonly>
			</div>

			<!-- 속성 카드 (상태, 담당자, 시작일, 마감일, 진척도) -->
			<div class="detail-props-card">
				<div class="detail-prop-row">
					<span class="prop-label">상태</span>
					<div class="prop-value-box">
						<!-- 조회 모드용 배지 (클릭 이벤트 제거) -->
						<span class="badge-status badge-req" id="detailStatusBadge">
							<span id="detailStatusText">● 예정</span>
						</span>
						<!-- 수정 모드용 상태 선택 드롭다운 -->
						<select class="detail-edit-select status-edit-only" id="detailStatusSelect">
							<option value="0">● 예정</option>
							<option value="1">● 진행</option>
							<option value="2">● 검토</option>
							<option value="3">● 완료</option>
						</select>
					</div>
				</div>

				<div class="detail-prop-row">
					<span class="prop-label">담당자</span>
					<div class="prop-value-box">
						<span class="inline-edit-select" id="detailAssigneeSelect">
						</span>
					</div>
				</div>

				<div class="detail-prop-row">
					<span class="prop-label">시작일</span>
					<div class="prop-value-box">
						<input type="date" class="inline-edit-date" id="detailStartDate" readonly>
					</div>
				</div>

				<div class="detail-prop-row">
					<span class="prop-label">마감일</span>
					<div class="prop-value-box">
						<input type="date" class="inline-edit-date" id="detailEndDate" readonly>
					</div>
				</div>

				<div class="detail-prop-row">
					<span class="prop-label">진척도</span>
					<div class="detail-progress-control">
						<!-- 수정 모드에서만 슬라이더 바 노출 -->
						<input type="range" id="detailProgressRange" min="0" max="100" step="5" value="0" disabled
						       oninput="document.getElementById('detailProgressLabel').textContent = this.value + '%'">
						<span class="progress-val-text" id="detailProgressLabel">0%</span>
					</div>
				</div>
			</div>

			<!-- 상세 내용 (평소엔 일반 글처럼 보이고, 수정 모드 시에만 입력창 형태) -->
			<div class="detail-section-block">
				<label class="detail-block-title" for="detailContentText">
					<span>📄 상세 내용</span>
				</label>
				<textarea class="detail-desc-textarea" id="detailContentText" placeholder="등록된 상세 내용이 없습니다." readonly></textarea>
			</div>

			<!-- 첨부파일 -->
			<div class="detail-section-block" id="detailAttachmentSection">
				<div class="detail-block-title">
					<span>📎 첨부파일</span>
					<span style="font-size:11.5px; color:var(--text-muted);" id="attachedFileCount">(0)</span>
				</div>
				<div class="detail-file-dropzone" id="fileDropzone">
					<div class="file-upload-trigger-row">
						<span style="font-size:12px; color:var(--text-sub);">파일을 끌어다 놓거나 선택하세요</span>
						<label class="btn-upload-attach">
							<span>＋ 파일 첨부</span>
							<input type="file" style="display:none;" onchange="handleFileUpload(this)">
						</label>
					</div>
					<div class="file-list-box" id="attachedFileList"></div>
				</div>
			</div>

			<!-- [메인 업무 선택 시 노출] 하위업무 목록 섹션 -->
			<div class="detail-subtasks-section" id="detailSubtasksSection">
				<div class="detail-section-Header-line">
					<div class="detail-section-title">
						<span>ㄴ 하위업무</span>
						<span style="color:var(--text-muted); font-size:12px;" id="detailSubtaskCount">0</span>
					</div>
					<!-- 상위 메인 업무 담당자에게만 하위업무 추가 버튼 노출 -->
					<button type="button" class="btn-detail-add-subtask" id="btnDetailAddSubtask" onclick="detailAddSubtaskClick()">＋ 하위업무 추가</button>
				</div>
				<div class="detail-subtask-box" id="detailSubtaskBox"></div>
			</div>
		</div>

		<script th:src="@{/dist/js/project/detail_panel.js}"></script>
		
		<!-- Quill Rich Text Editor -->
		<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
		<!-- Quill Editor Image Resize JS -->
		<script src="https://cdn.jsdelivr.net/npm/quill-resize-module@2.0.4/dist/resize.js"></script>
		
		<script th:src="@{/dist/posts/qeditor.js}"></script>
	</aside>
</body>
</html>
