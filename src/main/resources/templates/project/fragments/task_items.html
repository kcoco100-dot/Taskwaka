<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

	<!-- 메인 업무 행 (조회 전용 + 상위 업무 담당자에게만 '+ 하위업무 추가' 버튼 노출) -->
	<li th:fragment="mainTaskItem" class="task-branch" th:attr="data-task-id=${task.taskId}">
		<div class="task-item-row main-task task-grid-columns"
		     th:onclick="|openDetailPanel(${task.taskId}, this)|">

			<div class="col-task-name">
				<span class="btn-toggle-box task-toggle"
				      th:if="${task.subTasks != null and !#lists.isEmpty(task.subTasks)}"
				      onclick="event.stopPropagation(); toggleSubTasks(this)">－</span>
				<span style="width:20px; display:inline-block; flex-shrink:0;"
				      th:unless="${task.subTasks != null and !#lists.isEmpty(task.subTasks)}"></span>

				<span class="task-title-text" th:text="${task.title}">메인 업무명</span>

				<span style="font-size:12px; color:var(--text-muted);"
				      th:if="${task.subTasks != null and !#lists.isEmpty(task.subTasks)}">
					(<span class="sub-count" th:text="${#lists.size(task.subTasks)}">0</span>)
				</span>

				<!-- 권한 제어(th:if): 메인 업무 담당자에게만 하위업무 추가 버튼 표시 -->
				<span class="inline-action-bundle"
				      th:if="${currentProjectMemberId == null or task.projectMemberId == currentProjectMemberId}"
				      onclick="event.stopPropagation();">
					<button type="button" class="btn-action-tool btn-action-add"
					        th:onclick="|requestCreateSubTask(${task.taskId})|"
					        title="하위업무 추가">＋</button>
				</span>
			</div>

			<div>
				<span class="badge-status"
				      th:classappend="${task.status == 1 or task.status == 3} ? 'badge-done' : (${task.status == 2} ? 'badge-feedback' : (${task.status == 4} ? 'badge-hold' : 'badge-req'))"
				      th:text="${task.status == 1 ? '● 진행' : (task.status == 2 ? '● 피드백' : (task.status == 3 ? '● 완료' : (task.status == 4 ? '● 보류' : '● 요청')))}">● 요청</span>
			</div>

			<div class="col-assignee" th:text="${task.assigneeName != null ? task.assigneeName : ('담당자#' + task.projectMemberId)}">담당자</div>
			<div class="date-cell" th:text="${task.startAt != null ? task.startAt : '-'}">-</div>
			<div class="date-cell" th:classappend="${task.endAt != null} ? 'text-danger'" th:text="${task.endAt != null ? task.endAt : '-'}">-</div>
			<div>
				<div class="progress-cell">
					<div class="progress-bar-bg">
						<div class="progress-bar-fill" th:style="|width: ${task.progress != null ? task.progress : 0}%;|"></div>
					</div>
					<span class="progress-text" style="font-size:11.5px;" th:text="|${task.progress != null ? #numbers.formatInteger(task.progress, 1) : 0}%|">0%</span>
				</div>
			</div>
			<div style="font-size:11.5px; color:var(--text-muted);" th:text="${task.created != null ? task.created : '-'}">-</div>
			<div style="font-size:11.5px; color:var(--text-muted);" th:text="${task.updated != null ? task.updated : '-'}">-</div>
		</div>

		<ul class="sub-task-list" style="list-style:none; margin:0; padding:0;">
			<th:block th:if="${task.subTasks != null}">
				<th:block th:each="subTask : ${task.subTasks}">
					<li th:replace="~{project/fragments/task_items :: subTaskItem}"></li>
				</th:block>
			</th:block>
		</ul>
	</li>

	<!-- 하위 업무 행 (클릭 시 우측 상세 패널 오픈) -->
	<li th:fragment="subTaskItem"
	    class="task-item-row sub-task task-grid-columns"
	    th:attr="data-subtask-id=${subTask.subTaskId}, data-parent-task-id=${subTask.taskId}"
	    th:onclick="|openSubTaskDetailPanel(${subTask.subTaskId}, this)|">

		<div class="col-task-name indent-sub">
			<span style="color:var(--text-muted); font-size:12px;">ㄴ</span>
			<span class="task-title-text" th:text="${subTask.title}">하위업무명</span>

			<span class="my-subtask-tag"
			      th:if="${currentProjectMemberId != null and subTask.projectMemberId == currentProjectMemberId}"
			      title="내 담당 하위업무">📝 내 담당</span>

			<span class="inline-action-bundle" onclick="event.stopPropagation();">
				<button type="button" class="btn-action-tool btn-action-del"
				        th:onclick="|openDeleteModal('subtask', ${subTask.subTaskId}, this)|"
				        title="하위업무 삭제">
					<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
				</button>
			</span>
		</div>

		<div>
			<span class="badge-status"
			      th:classappend="${subTask.status == 1 or subTask.status == 3} ? 'badge-done' : (${subTask.status == 2} ? 'badge-feedback' : (${subTask.status == 4} ? 'badge-hold' : 'badge-req'))"
			      th:text="${subTask.status == 1 ? '● 진행' : (subTask.status == 2 ? '● 피드백' : (subTask.status == 3 ? '● 완료' : (subTask.status == 4 ? '● 보류' : '● 요청')))}">● 요청</span>
		</div>

		<div class="col-assignee" th:text="${subTask.assigneeName != null ? subTask.assigneeName : ('담당자#' + subTask.projectMemberId)}">담당자</div>
		<div class="date-cell" th:text="${subTask.startAt != null ? subTask.startAt : '-'}">-</div>
		<div class="date-cell" th:classappend="${subTask.endAt != null} ? 'text-danger'" th:text="${subTask.endAt != null ? subTask.endAt : '-'}">-</div>
		<div>
			<div class="progress-cell">
				<div class="progress-bar-bg">
					<div class="progress-bar-fill" th:style="|width: ${subTask.progress != null ? subTask.progress : 0}%;|"></div>
				</div>
				<span class="progress-text" style="font-size:11.5px;" th:text="|${subTask.progress != null ? #numbers.formatInteger(subTask.progress, 1) : 0}%|">0%</span>
			</div>
		</div>
		<div style="font-size:11.5px; color:var(--text-muted);" th:text="${subTask.created != null ? subTask.created : '-'}">-</div>
		<div style="font-size:11.5px; color:var(--text-muted);" th:text="${subTask.updated != null ? subTask.updated : '-'}">-</div>
	</li>

</body>
</html>
