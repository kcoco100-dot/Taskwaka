<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
  <div th:fragment="content">
    <style>
      .task-panel { background: #FFFFFF; border: 1px solid var(--border-main); border-radius: 14px; padding: 24px; box-shadow: 0 2px 8px rgba(89, 67, 49, 0.03); }
      .toolbar { display: flex; justify-content: space-between; margin-bottom: 16px; }
      .warm-select { padding: 7px 12px; border: 1px solid var(--border-main); border-radius: 8px; background: #FFFFFF; color: var(--text-main); font-size: 13px; outline: none; }
      .btn-add { padding: 7px 14px; background: var(--primary-green); color: #FFFFFF; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
      .warm-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
      .warm-table th { background: var(--bg-sidebar); padding: 11px 14px; border-bottom: 1px solid var(--border-main); color: var(--text-sub); font-weight: 600; }
      .warm-table td { padding: 12px 14px; border-bottom: 1px solid var(--border-main); color: var(--text-main); vertical-align: middle; }
      .warm-table tr:hover td { background: var(--bg-hover); }
      .badge-req { display: inline-block; padding: 3px 8px; border-radius: 6px; background: var(--status-req-bg); color: var(--status-req-text); font-size: 11px; font-weight: 700; }
      .badge-done { display: inline-block; padding: 3px 8px; border-radius: 6px; background: var(--status-done-bg); color: var(--status-done-text); font-size: 11px; font-weight: 700; }
    </style>

    <div class="task-panel">
      <div class="toolbar">
        <div>
          <select class="warm-select"><option>전체 업무</option></select>
          <button class="warm-select" style="cursor: pointer; margin-left: 6px;">필터</button>
        </div>
        <button class="btn-add">＋ 업무 추가</button>
      </div>

      <table class="warm-table">
        <thead>
          <tr>
            <th style="width: 45%;">업무명</th>
            <th style="width: 15%;">상태</th>
            <th style="width: 20%;">담당자</th>
            <th style="width: 20%;">마감일</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>[1단계] Taskwaka 기능 영상 확인하기 🎬</strong></td>
            <td><span class="badge-req">● 요청</span></td>
            <td>박혜림</td>
            <td style="color: var(--status-danger);">2026-09-30</td>
          </tr>
          <tr>
            <td><strong>[2단계] 프로필 사진 등록하기 👩‍💼</strong></td>
            <td><span class="badge-done">● 완료</span></td>
            <td>박혜림</td>
            <td>2026-10-02</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
