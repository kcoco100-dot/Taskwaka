<!DOCTYPE html>

		<!-- ==========================================================================
       [CSS SECTION] 풀 높이 오버레이 상세창 & 최적화된 10컬럼 그리드 스타일

		<style>
.content-area:has(.task-split-view-wrapper) {
	padding: 0 !important;
	overflow: hidden !important;
	height: 100% !important;
}

.task-split-view-wrapper {
	display: flex;
	width: 100%;
	height: 100%;
	min-height: calc(100vh - 154px);
	position: relative;
	overflow: hidden;
	background: var(--bg-body, #FCFBF8);
}

.task-tree-page {
	width: 100%;
	height: 100%;
	display: flex;
	flex-direction: column;
	gap: 20px;
	overflow-y: auto;
	padding: 24px 28px;
}

.task-scroll-wrapper {
	width: 100%;
	overflow-x: auto;
	padding-bottom: 8px;
}

/* 10개 열 황금 비율 그리드 규격 */
.task-grid-columns {
	display: grid;
	grid-template-columns: minmax(260px, 3fr) 80px 90px 100px 100px 75px 90px 90px 135px 135px;
	min-width: 1155px;
	align-items: center;
}

.task-grid-header {
	background: var(--bg-sidebar, #F7F3EE);
	border: 1px solid var(--border-main, #E8E2D9);
	border-radius: 12px;
	list-style: none;
	margin: 0 0 16px 0;
	padding: 0;
	color: var(--text-sub, #786B5E);
	font-size: 12.5px;
	font-weight: 700;
}

.task-grid-header li {
	padding: 12px 14px;
	display: flex;
	align-items: center;
}

.group-container {
	display: flex;
	flex-direction: column;
	gap: 24px;
	min-width: 1155px;
	margin-bottom: 12px;
}

.group-card {
	background: var(--bg-card-sub, #FCFAF6);
	border: 1px solid var(--border-main, #E8E2D9);
	border-radius: 16px;
	padding: 12px 14px 14px 14px;
	box-shadow: 0 3px 10px rgba(89, 67, 49, 0.04);
	display: flex;
	flex-direction: column;
	gap: 12px;
	position: relative;
}

.group-header-row {
	display: flex;
	align-items: center;
	gap: 8px;

	font-weight: 700;
	color: var(--text-main, #594331);

}

.btn-toggle-box,
.btn-action-tool {
	width: 20px;
	height: 20px;
	border: 1px solid var(--border-main, #E8E2D9);
	border-radius: 5px;
	background: #FFFFFF;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	cursor: pointer;
	user-select: none;

.btn-toggle-box {

.btn-toggle-box:hover {

}

.inline-action-bundle {
	display: inline-flex;
	align-items: center;
	gap: 4px;
	margin-left: 6px;
	opacity: 0;
	visibility: hidden;
	transition: opacity 0.15s ease-in-out, visibility 0.15s;
}

.task-item-row:hover .inline-action-bundle,
.group-header-row:hover .inline-action-bundle {
	opacity: 1;
	visibility: visible;
}

.btn-action-add {

}

}

.group-body {

}

.task-box-inner {

.task-item-row {

}

.task-item-row>div {

	align-items: center;

.task-item-row.main-task {

}

.task-item-row.selected-task-row {

.task-item-row.sub-task {

}

}

.col-task-name {

	overflow: hidden;
}

	padding-left: 42px !important;
}

.editable-cell {

	display: inline-flex;
	align-items: center;

}

.editable-cell:hover {

.task-title-text {

.inline-edit-input {

}

.inline-edit-date {

	font-size: 11.5px;
	padding: 2px 4px;

	color: var(--text-main, #594331);

	width: 100px;
}

.inline-edit-select {
	font-family: inherit;
	font-size: 12px;
	padding: 2px 4px;
	border: 1px solid var(--accent-green, #71865B);
	border-radius: 4px;
	background: #FFFFFF;
	color: var(--text-main, #594331);
	outline: none;
	cursor: pointer;
}

.badge-status {
	display: inline-flex;
	align-items: center;
	gap: 4px;
	padding: 3px 8px;
	border-radius: 6px;
	font-size: 11px;
	font-weight: 700;
	cursor: pointer;
	user-select: none;
	transition: opacity 0.15s;
}

.badge-status:hover {
	opacity: 0.85;
}

.badge-req { background: #E0F2FE; color: #0284C7; }
.badge-done { background: var(--status-done-bg, #E8F0DE); color: var(--status-done-text, #465B38); }
.badge-hold { background: #F1F3F7; color: #64748B; }

.text-danger { color: var(--status-danger, #D9534F); font-weight: 600; }

.progress-cell {
	display: flex;
	align-items: center;
	gap: 6px;
	padding: 2px 4px;
	border-radius: 4px;
}

.progress-cell:hover {
	background: rgba(79, 98, 66, 0.08);
}

.progress-bar-bg {
	width: 40px;
	height: 6px;
	background: #E2E8F0;
	border-radius: 3px;
	overflow: hidden;
}

.progress-bar-fill {
	height: 100%;

.btn-add-task-row {

	font-size: 13px;
	font-weight: 700;
	color: var(--primary-green, #4F6242);
	cursor: pointer;
	display: inline-flex;
	align-items: center;
	gap: 6px;
	user-select: none;
	background: #FFFFFF;
	border: 1px dashed var(--primary-green-border, #DCE5D2);

}

.btn-add-task-row:hover {
	background: var(--primary-green-light, #EEF4E6);
	border-color: var(--primary-green, #4F6242);
}

.btn-add-group {
	align-self: flex-start;
	padding: 9px 18px;
	border: 1px solid var(--border-main, #E8E2D9);
	border-radius: 10px;
	background: #FFFFFF;
	color: var(--text-main, #594331);
	font-size: 13.5px;
	font-weight: 700;

	display: inline-flex;
	align-items: center;
	gap: 6px;

.btn-add-group:hover {

	background: var(--bg-hover, #EFE8DE);
}

/* 오버레이 상세 패널 */
.task-detail-panel {
	position: absolute;
	right: 0;
	top: 0;
	bottom: 0;
	width: 520px;
	min-width: 380px;
	max-width: 860px;
	height: 100%;
	min-height: 100%;
	background: #FFFFFF;
	border-left: 1px solid var(--border-main, #E8E2D9);
	display: none;
	flex-direction: column;
	z-index: 70;
	box-shadow: -8px 0 24px rgba(89, 67, 49, 0.1);
	overflow: hidden;
	animation: slideInDrawer 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.task-detail-panel.active { display: flex; }

@keyframes slideInDrawer {
	from { transform: translateX(100%); }
	to { transform: translateX(0); }
}

.pane-resizer-bar {
	position: absolute;
	left: 0;
	top: 0;
	bottom: 0;
	width: 6px;
	cursor: col-resize;
	background: transparent;
	user-select: none;
	z-index: 80;
	transition: background 0.15s;
}

.pane-resizer-bar:hover,
.pane-resizer-bar.dragging {

}

	align-items: center;
	justify-content: space-between;

.detail-content-scroll {

}

.detail-avatar-badge {

			<aside class="task-detail-panel" id="taskDetailSidePanel">
				<div class="pane-resizer-bar" id="paneResizerBar" title="좌우로 드래그하여 패널 너비 조절"></div>

				<div class="detail-top-nav">
					<div style="display:flex; align-items:center; gap:6px;">
						<span>🌿</span>
						<span id="detailProjectTitle">Taskwaka 시작가이드</span>
					</div>
					<button type="button" class="detail-close-btn" onclick="closeDetailPanel()" title="닫기 (ESC)">✕</button>
				</div>

				<div class="detail-content-scroll">
					<div class="detail-meta-header">
						<div class="detail-author-box">
							<div class="detail-avatar-badge" id="detailAuthorAvatar">혜림</div>
							<div>
								<span class="detail-author-name" id="detailAuthorName">박혜림</span>
								<span class="detail-created-date" id="detailCreatedDate">-</span>
							</div>
						</div>
						<div class="detail-header-tools">
							<button type="button" class="btn-link-action" onclick="alert('피드 게시물로 이동합니다.');">게시글 바로가기 ↗</button>
						</div>

					<div class="detail-title-row">
						<input type="text" class="detail-task-title-input" id="detailTaskTitle" value="" onchange="onDetailTitleChange(this.value)">

					<div class="detail-prop-row">

						<div style="position:relative;">
							<span class="badge-status badge-req" id="detailStatusBadge" onclick="cycleDetailStatus(this)">
								<span id="detailStatusText">● 요청</span> <span style="font-size:9px;">▾</span>
							</span>
						</div>
					</div>

					<div>
						<button type="button" class="btn-expand-more-props" onclick="toggleExtendedProps(this)">
							<span id="extendPropsIcon">＋</span> 추가 항목 보기
						</button>
						<div class="detail-extended-props" id="extendedPropsContainer">
							<div class="detail-prop-row">
								<span class="prop-label">담당자</span>
								<select class="inline-edit-select" id="detailAssigneeSelect">
									<option value="박혜림" selected>박혜림</option>
									<option value="김철수">김철수</option>
									<option value="이영희">이영희</option>
									<option value="-">-</option>
								</select>
							</div>
							<div class="detail-prop-row">
								<span class="prop-label">시작일</span>
								<input type="date" class="inline-edit-date" id="detailStartDate" onchange="onDetailDateChange('startAt', this.value)">
							</div>
							<div class="detail-prop-row">
								<span class="prop-label">마감일</span>
								<input type="date" class="inline-edit-date" id="detailEndDate" onchange="onDetailDateChange('endAt', this.value)">

							<div class="detail-prop-row">
								<span class="prop-label">우선순위</span>
								<select class="inline-edit-select" id="detailPrioritySelect">
									<option value="-">-</option>
									<option value="낮음">낮음</option>
									<option value="보통">보통</option>
									<option value="높음">높음</option>
									<option value="긴급">긴급</option>
								</select>
							</div>
						</div>
					</div>

					<!-- 상세 내용 -->
					<div class="detail-section-block">
						<label class="detail-block-title" for="detailContentText">
							<span>📄 상세 내용</span>
						</label>
						<textarea class="detail-desc-textarea" id="detailContentText" placeholder="업무에 대한 상세한 설명과 가이드를 입력해 주세요..." onchange="onDetailContentChange(this.value)"></textarea>
					</div>

					<!-- 파일 첨부 -->
					<div class="detail-section-block">
						<div class="detail-block-title">
							<span>📎 첨부파일</span>
							<span style="font-size:11.5px; color:var(--text-muted);" id="attachedFileCount">(0)</span>
						</div>
						<div class="detail-file-dropzone" id="fileDropzone">
							<div class="file-upload-trigger-row">
								<span style="font-size:12px; color:var(--text-sub);">파일을 끌어다 놓거나 선택하세요</span>
								<label class="btn-upload-attach">
									<span>＋ 파일 첨부</span>
									<input type="file" style="display:none;" onchange="handleFileUpload(this)">
								</label>
							</div>
							<div class="file-list-box" id="attachedFileList"></div>
						</div>
					</div>

					<!-- 하위업무 섹션 -->
					<div class="detail-subtasks-section">
						<div class="detail-section-title">
							<span>ㄴ 하위업무</span>
							<span style="color:var(--text-muted); font-size:12px;" id="detailSubtaskCount">0</span>
						</div>
						<div class="detail-subtask-box" id="detailSubtaskBox"></div>
						<button type="button" class="btn-detail-add-subtask" onclick="detailAddSubtaskClick()">＋ 하위업무 추가</button>
					</div>
				</div>
			</aside>
		</div>

		<!-- 삭제 모달 -->
		<div class="custom-modal-backdrop" id="deleteConfirmModal" onclick="handleBackdropClick(event)">
			<div class="custom-modal-card">
				<div class="modal-header-area">
					<div class="modal-icon-badge">
						<svg style="width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;" viewBox="0 0 24 24">
							<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
							<line x1="12" y1="9" x2="12" y2="13"></line>
							<line x1="12" y1="17" x2="12.01" y2="17"></line>
						</svg>
					</div>
					<div class="modal-title-group">
						<div class="modal-main-title" id="modalTargetTitle">항목 삭제 확인</div>
						<div class="modal-desc-text" id="modalDescNotice">선택한 항목을 영구 삭제하시겠습니까?</div>
					</div>
				</div>
				<div class="modal-actions-area">
					<button type="button" class="btn-modal-cancel" onclick="closeDeleteModal()">취소</button>
					<button type="button" class="btn-modal-confirm" id="btnModalConfirmDelete" onclick="executeConfirmedDelete()">삭제하기</button>
				</div>
			</div>
		</div>

		<!-- ==========================================================================
       [JAVASCRIPT SECTION] 실제 REST API CRUD 비동기 연동
       ========================================================================== -->
		<script>
      const currentProjectId = 1; // 기본 프로젝트 ID
      const teamMemberList = ['박혜림', '김철수', '이영희', '홍길동', '-'];
      const priorityList = ['-', '낮음', '보통', '높음', '긴급'];
      const statusMap = [
        { code: 0, text: '● 요청', class: 'badge-req' },
        { code: 1, text: '● 진행', class: 'badge-done' },
        { code: 2, text: '● 피드백', class: 'badge-feedback' },
        { code: 3, text: '● 완료', class: 'badge-done' },
        { code: 4, text: '● 보류', class: 'badge-hold' }
      ];

      const trashSvg = `<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>`;

      let currentActiveRow = null;
      let currentActiveTaskId = null;
      let pendingDeleteContext = null;

      // ================= 1. 페이지 로드 시 DB에서 전체 업무 목록 조회 =================
      document.addEventListener('DOMContentLoaded', function() {
        loadTasksFromDatabase();
      });

      function loadTasksFromDatabase() {
        fetch(`/api/projects/${currentProjectId}/tasks`)
          .then(res => res.json())
          .then(tasks => {
            renderTaskTree(tasks);
          })
          .catch(err => console.error('업무 목록 로딩 실패:', err));
      }

      function renderTaskTree(tasks) {
        const container = document.getElementById('groupContainer');
        container.innerHTML = '';

        // 기본 2개 그룹 구성 (1: 그룹 1, 0: 그룹 미지정)
        const groups = [
          { level: 1, title: '그룹 1', tasks: [] },
          { level: 0, title: '그룹 미지정', tasks: [] }
        ];

        tasks.forEach(t => {
          if (t.taskLevel === 1) groups[0].tasks.push(t);
          else groups[1].tasks.push(t);
        });

        groups.forEach(g => {
          const card = document.createElement('div');
          card.className = 'group-card';
          card.setAttribute('data-group-level', g.level);
          
          let tasksHtml = '';
          g.tasks.forEach(task => {
            tasksHtml += renderMainTaskHtml(task);
          });

          card.innerHTML = `
            <div class="group-header-row">
              <span class="btn-toggle-box group-toggle" onclick="toggleGroup(this)">－</span>
              <span class="group-title editable-cell">${g.title}</span>
              <span style="font-size: 13px; color: var(--text-muted);">(<span class="group-count">${g.tasks.length}</span>)</span>
            </div>
            <div class="group-body">
              <div class="task-box-inner" style="${g.tasks.length === 0 ? 'display:none;' : ''}">
                <ul class="task-tree-list">
                  ${tasksHtml}
                </ul>
              </div>
              <div class="btn-add-task-row" onclick="requestCreateMainTask(${g.level})">＋ 새 업무 추가</div>
            </div>
          `;
          container.appendChild(card);
        });
      }

      function renderMainTaskHtml(task) {
        const statusObj = statusMap.find(s => s.code === task.status) || statusMap[0];
        const subCount = task.subTasks ? task.subTasks.length : 0;
        let subTasksHtml = '';

        if (task.subTasks && task.subTasks.length > 0) {
          task.subTasks.forEach(st => {
            subTasksHtml += renderSubTaskHtml(st);
          });
        }

        return `
          <li class="task-branch" data-task-id="${task.taskId}">
            <div class="task-item-row main-task task-grid-columns" onclick="openDetailPanel(${task.taskId}, this)">
              <div class="col-task-name">
                ${subCount > 0 
                  ? `<span class="btn-toggle-box task-toggle" onclick="event.stopPropagation(); toggleSubTasks(this)">－</span>` 
                  : `<span style="width: 20px;"></span>`}
                <span class="task-title-text editable-cell" onclick="event.stopPropagation(); editTitle(this, ${task.taskId}, false)">${task.title}</span>
                ${subCount > 0 ? `<span style="font-size:12px; color:var(--text-muted);">(<span class="sub-count">${subCount}</span>)</span>` : ''}
                <span class="inline-action-bundle">
                  <button type="button" class="btn-action-tool btn-action-add" onclick="event.stopPropagation(); requestCreateSubTask(${task.taskId})" title="하위업무 추가">＋</button>
                  <button type="button" class="btn-action-tool btn-action-del" onclick="event.stopPropagation(); openDeleteModal('task', ${task.taskId}, this)" title="업무 삭제">${trashSvg}</button>
                </span>
              </div>
              <div><span class="badge-status ${statusObj.class}" onclick="event.stopPropagation(); cycleStatus(this, ${task.taskId}, false)">${statusObj.text}</span></div>
              <div><span class="editable-cell assignee-cell">${task.memberName || '미지정'}</span></div>
              <div><span class="editable-cell date-cell" onclick="event.stopPropagation(); editDate(this, ${task.taskId}, 'startAt', false)">${task.startAt || '-'}</span></div>
              <div><span class="editable-cell date-cell ${task.endAt ? 'text-danger' : ''}" onclick="event.stopPropagation(); editDate(this, ${task.taskId}, 'endAt', false)">${task.endAt || '-'}</span></div>
              <div><span class="editable-cell priority-cell">-</span></div>
              <div>
                <div class="progress-cell">
                  <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${task.progress || 0}%;"></div></div>
                  <span class="progress-text" style="font-size:12px;">${Math.round(task.progress || 0)}%</span>
                </div>
              </div>
              <div>${task.memberName || '미지정'}</div>
              <div style="font-size: 12px; color: var(--text-muted);">${task.created || '-'}</div>
              <div class="col-updated-at" style="font-size: 12px; color: var(--text-muted);">${task.updated || '-'}</div>
            </div>
            <ul class="sub-task-list" style="list-style: none; padding: 0; margin: 0;">
              ${subTasksHtml}
            </ul>
          </li>
        `;
      }

      function renderSubTaskHtml(st) {
        const statusObj = statusMap.find(s => s.code === st.status) || statusMap[0];
        return `
          <li class="task-item-row sub-task task-grid-columns" data-sub-id="${st.subTaskId}">
            <div class="col-task-name indent-sub">
              <span class="task-title-text editable-cell" onclick="event.stopPropagation(); editTitle(this, ${st.subTaskId}, true)">${st.title}</span>
              <span class="inline-action-bundle">
                <button type="button" class="btn-action-tool btn-action-del" onclick="event.stopPropagation(); openDeleteModal('subtask', ${st.subTaskId}, this)" title="하위업무 삭제">${trashSvg}</button>
              </span>
            </div>
            <div><span class="badge-status ${statusObj.class}" onclick="event.stopPropagation(); cycleStatus(this, ${st.subTaskId}, true)">${statusObj.text}</span></div>
            <div><span class="editable-cell assignee-cell">${st.memberName || '미지정'}</span></div>
            <div><span class="editable-cell date-cell" onclick="event.stopPropagation(); editDate(this, ${st.subTaskId}, 'startAt', true)">${st.startAt || '-'}</span></div>
            <div><span class="editable-cell date-cell ${st.endAt ? 'text-danger' : ''}" onclick="event.stopPropagation(); editDate(this, ${st.subTaskId}, 'endAt', true)">${st.endAt || '-'}</span></div>
            <div><span class="editable-cell priority-cell">-</span></div>
            <div>
              <div class="progress-cell">
                <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${st.progress || 0}%;"></div></div>
                <span class="progress-text" style="font-size:12px;">${Math.round(st.progress || 0)}%</span>
              </div>
            </div>
            <div>${st.memberName || '미지정'}</div>
            <div style="font-size: 12px; color: var(--text-muted);">${st.created || '-'}</div>
            <div class="col-updated-at" style="font-size: 12px; color: var(--text-muted);">${st.updated || '-'}</div>
          </li>
        `;
      }

      // ================= 2. 등록 API 연동 =================
      function requestCreateMainTask(level) {
        const title = prompt('새 업무명을 입력하세요:', '새 업무');
        if (!title) return;

        fetch(`/api/projects/${currentProjectId}/tasks`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: title,
            taskLevel: level,
            projectMemberId: 1
          })
        })
        .then(res => res.json())
        .then(() => loadTasksFromDatabase());
      }

      function requestCreateSubTask(taskId) {
        const title = prompt('추가할 하위업무명을 입력하세요:', '새 하위업무');
        if (!title) return;

        fetch(`/api/projects/${currentProjectId}/tasks/${taskId}/subtasks`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: title,
            projectMemberId: 1
          })
        })
        .then(res => res.json())
        .then(() => {
          loadTasksFromDatabase();
          if (currentActiveTaskId === taskId) {
            refreshDetailPanel(taskId);
          }
        });
      }

      function detailAddSubtaskClick() {
        if (currentActiveTaskId) requestCreateSubTask(currentActiveTaskId);
      }

      // ================= 3. 인라인 수정 API 연동 =================
      function editTitle(cell, id, isSub) {
        if (cell.querySelector('input')) return;
        const oldText = cell.textContent.trim();
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'inline-edit-input';
        input.value = oldText;

        cell.textContent = '';
        cell.appendChild(input);
        input.focus();
        input.select();

        function finish() {
          const newText = input.value.trim() || oldText;
          cell.textContent = newText;
          if (newText !== oldText) {
            const url = isSub 
              ? `/api/projects/${currentProjectId}/tasks/subtasks/${id}/field`
              : `/api/projects/${currentProjectId}/tasks/${id}/field`;
            fetch(url, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ fieldName: 'title', fieldValue: newText })
            }).then(() => {
              if (currentActiveTaskId === id) document.getElementById('detailTaskTitle').value = newText;
            });
          }
        }
        input.onblur = finish;
        input.onkeydown = e => { if (e.key === 'Enter') finish(); else if (e.key === 'Escape') cell.textContent = oldText; };
      }

      function cycleStatus(badge, id, isSub) {
        const text = badge.textContent.trim();
        let idx = statusMap.findIndex(s => s.text === text);
        const next = statusMap[(idx + 1) % statusMap.length];

        badge.className = 'badge-status ' + next.class;
        badge.textContent = next.text;

        const url = isSub 
          ? `/api/projects/${currentProjectId}/tasks/subtasks/${id}/field`
          : `/api/projects/${currentProjectId}/tasks/${id}/field`;
        fetch(url, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fieldName: 'status', fieldValue: next.code })
        }).then(() => {
          if (currentActiveTaskId === id) {
            document.getElementById('detailStatusBadge').className = 'badge-status ' + next.class;
            document.getElementById('detailStatusText').textContent = next.text;
          }
        });
      }

      function editDate(cell, id, fieldName, isSub) {
        if (cell.querySelector('input')) return;
        const currentVal = cell.textContent.trim() === '-' ? '' : cell.textContent.trim();
        const input = document.createElement('input');
        input.type = 'date';
        input.className = 'inline-edit-date';
        if (currentVal) input.value = currentVal;

        cell.textContent = '';
        cell.appendChild(input);
        input.focus();

        function finish() {
          const picked = input.value || '';
          cell.textContent = picked || '-';
          const url = isSub 
            ? `/api/projects/${currentProjectId}/tasks/subtasks/${id}/field`
            : `/api/projects/${currentProjectId}/tasks/${id}/field`;
          fetch(url, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fieldName: fieldName, fieldValue: picked })
          });
        }
        input.onblur = finish;
        input.onchange = finish;
      }

      // ================= 4. 상세창 열기 & 동기화 =================
      function openDetailPanel(taskId, rowElem) {
        document.querySelectorAll('.task-item-row').forEach(r => r.classList.remove('selected-task-row'));
        rowElem.classList.add('selected-task-row');

        currentActiveRow = rowElem;
        currentActiveTaskId = taskId;

        fetch(`/api/projects/${currentProjectId}/tasks/${taskId}`)
          .then(res => res.json())
          .then(task => {
            document.getElementById('taskDetailSidePanel').classList.add('active');
            document.getElementById('detailTaskTitle').value = task.title || '';
            document.getElementById('detailCreatedDate').textContent = task.created || '';
            document.getElementById('detailContentText').value = task.content || '';
            document.getElementById('detailStartDate').value = task.startAt || '';
            document.getElementById('detailEndDate').value = task.endAt || '';

            const statusObj = statusMap.find(s => s.code === task.status) || statusMap[0];
            document.getElementById('detailStatusBadge').className = 'badge-status ' + statusObj.class;
            document.getElementById('detailStatusText').textContent = statusObj.text;

            // 하위업무
            const subBox = document.getElementById('detailSubtaskBox');
            subBox.innerHTML = '';
            const subCount = task.subTasks ? task.subTasks.length : 0;
            document.getElementById('detailSubtaskCount').textContent = subCount;

            if (task.subTasks && task.subTasks.length > 0) {
              task.subTasks.forEach(st => {
                const stStatus = statusMap.find(s => s.code === st.status) || statusMap[0];
                const div = document.createElement('div');
                div.className = 'detail-subtask-row';
                div.innerHTML = `<span class="badge-status ${stStatus.class}">${stStatus.text}</span><span>${st.title}</span>`;
                subBox.appendChild(div);
              });
            } else {
              subBox.innerHTML = '<div style="padding:10px 14px; font-size:12.5px; color:var(--text-muted);">등록된 하위업무가 없습니다.</div>';
            }
          });
      }

      function closeDetailPanel() {
        document.getElementById('taskDetailSidePanel').classList.remove('active');
        if (currentActiveRow) {
          currentActiveRow.classList.remove('selected-task-row');
          currentActiveRow = null;
        }
      }

      function onDetailTitleChange(val) {
        if (!currentActiveTaskId) return;
        fetch(`/api/projects/${currentProjectId}/tasks/${currentActiveTaskId}/field`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fieldName: 'title', fieldValue: val })
        }).then(() => loadTasksFromDatabase());
      }

      function onDetailContentChange(val) {
        if (!currentActiveTaskId) return;
        fetch(`/api/projects/${currentProjectId}/tasks/${currentActiveTaskId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: val })
        });
      }

      function onDetailDateChange(fieldName, val) {
        if (!currentActiveTaskId) return;
        fetch(`/api/projects/${currentProjectId}/tasks/${currentActiveTaskId}/field`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fieldName: fieldName, fieldValue: val })
        }).then(() => loadTasksFromDatabase());
      }

      function cycleDetailStatus(badge) {
        if (!currentActiveTaskId) return;
        const text = document.getElementById('detailStatusText').textContent.trim();
        let idx = statusMap.findIndex(s => s.text === text);
        const next = statusMap[(idx + 1) % statusMap.length];

        badge.className = 'badge-status ' + next.class;
        document.getElementById('detailStatusText').textContent = next.text;

        fetch(`/api/projects/${currentProjectId}/tasks/${currentActiveTaskId}/field`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fieldName: 'status', fieldValue: next.code })
        }).then(() => loadTasksFromDatabase());
      }

      function toggleExtendedProps(btn) {
        const box = document.getElementById('extendedPropsContainer');
        const icon = document.getElementById('extendPropsIcon');
        if (box.classList.contains('show')) {
          box.classList.remove('show');
          icon.textContent = '＋';
        } else {
          box.classList.add('show');
          icon.textContent = '－';
        }
      }

      // ================= 5. 삭제 모달 & API 연동 =================
      function openDeleteModal(type, targetId, btnElement) {
        const modal = document.getElementById('deleteConfirmModal');
        const title = document.getElementById('modalTargetTitle');
        const notice = document.getElementById('modalDescNotice');

        if (type === 'task') {
          title.textContent = '업무 삭제';
          notice.innerHTML = '선택한 업무와 포함된 하위업무가 모두 영구 삭제됩니다.';
        } else if (type === 'subtask') {
          title.textContent = '하위업무 삭제';
          notice.innerHTML = '선택한 하위업무를 영구 삭제하시겠습니까?';
        }

        pendingDeleteContext = { type, targetId };
        modal.classList.add('show');
      }

      function closeDeleteModal() {
        document.getElementById('deleteConfirmModal').classList.remove('show');
        pendingDeleteContext = null;
      }

      function handleBackdropClick(e) {
        if (e.target === document.getElementById('deleteConfirmModal')) closeDeleteModal();
      }

      function executeConfirmedDelete() {
        if (!pendingDeleteContext) return;
        const { type, targetId } = pendingDeleteContext;

        const url = type === 'task'
          ? `/api/projects/${currentProjectId}/tasks/${targetId}`
          : `/api/projects/${currentProjectId}/tasks/subtasks/${targetId}`;

        fetch(url, { method: 'DELETE' })
          .then(res => res.json())
          .then(() => {
            closeDeleteModal();
            closeDetailPanel();
            loadTasksFromDatabase();
          });
      }

      // ================= 6. 너비 조절 리사이저 바 =================
      const resizerBar = document.getElementById('paneResizerBar');
      const sidePanel = document.getElementById('taskDetailSidePanel');
      const splitWrapper = document.getElementById('taskSplitViewWrapper');
      let isDragging = false;

      resizerBar.addEventListener('mousedown', () => { isDragging = true; document.body.style.cursor = 'col-resize'; });
      document.addEventListener('mousemove', e => {
        if (!isDragging) return;
        let newWidth = splitWrapper.getBoundingClientRect().right - e.clientX;
        if (newWidth < 380) newWidth = 380;
        if (newWidth > 860) newWidth = 860;
        sidePanel.style.width = newWidth + 'px';
      });
      document.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; document.body.style.cursor = ''; } });
      document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDeleteModal(); closeDetailPanel(); } });

      function toggleGroup(btn) {
        const body = btn.closest('.group-card').querySelector('.group-body');
        if (body.style.display === 'none') { body.style.display = 'flex'; btn.textContent = '－'; }
        else { body.style.display = 'none'; btn.textContent = '＋'; }
      }

      function toggleSubTasks(btn) {
        const subList = btn.closest('.task-branch').querySelector('.sub-task-list');
        if (subList.style.display === 'none') { subList.style.display = ''; btn.textContent = '－'; }
        else { subList.style.display = 'none'; btn.textContent = '＋'; }
      }

      function handleFileUpload(input) {
        if (!input.files || input.files.length === 0) return;
        const file = input.files[0];
        const fileList = document.getElementById('attachedFileList');
        const div = document.createElement('div');
        div.className = 'attached-file-item';
        div.innerHTML = `
          <div class="attached-file-info">
            <span>📁</span>
            <span style="font-weight:600;">${file.name}</span>
            <span style="color:var(--text-muted); font-size:11px;">(${(file.size / (1024 * 1024)).toFixed(1)} MB)</span>
          </div>
          <button type="button" class="btn-del-file" onclick="this.closest('.attached-file-item').remove()" title="삭제">✕</button>
        `;
        fileList.appendChild(div);
        document.getElementById('attachedFileCount').textContent = `(${fileList.children.length})`;
      }
    </script>
	</div>
</body>
</html>
