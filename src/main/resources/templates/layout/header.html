<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<th:block th:fragment="headerFooterAssets">
	<link th:fragment="favicon" rel="icon" type="image/png" th:href="@{/dist/images/taskwaka-bear-icon.png}">
	<link rel="stylesheet" th:href="@{/dist/css/header.css}">
	<link rel="stylesheet" th:href="@{/dist/css/footer.css}">
	<link rel="stylesheet" th:href="@{/dist/css/task-modal.css}">
</th:block>

<th:block th:fragment="header"
          th:with="key=${domainKey != null ? domainKey : (workspace != null ? workspace.domainKey : null)}">
	<th:block th:replace="~{layout/header :: bar('work', ${#strings.isEmpty(key)} ? @{/main} : @{/{key}/home/dashboard(key=${key})}, ~{})}"></th:block>
</th:block>

<th:block th:fragment="bar(area, homeUrl, actions)" th:with="inWork=${area == 'work' and workspace != null}">
	<div class="team-header">
		<div class="team-header-left">
			<a th:href="${homeUrl}" class="team-logo">
				<img th:src="@{/dist/images/taskwaka-bear-icon.png}" 
					class="team-logo-image" alt="">
				<span>TASKWAKA</span>
			</a>
			<span class="team-name" th:if="${inWork}" th:text="${workspace.subject}"></span>
			<span class="team-name" th:if="${area == 'admin'}">System Admin</span>
		</div>
		
		
		<th:block th:if="${!inWork and area != 'admin' and #authentication != null and #authentication.principal instanceof T(com.tk.app.security.CustomUserDetails)}">
			<th:block th:replace="~{siteNoticeTicker/site-notice-ticker :: siteNoticeTicker}"></th:block>
		</th:block>
		<div class="team-header-right">
		    <th:block th:replace="${actions}"></th:block>
		    <button type="button" id="organizationToggle" class="header-action-button" th:if="${inWork}"
                aria-controls="organizationModal" aria-expanded="false" title="프로젝트 조직도 열기">
                <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>프로젝트</span>
            </button>
		    <button type="button" id="workchatToggle" class="header-action-button header-action-button--chat" th:if="${inWork}" aria-controls="workchatModal" aria-expanded="false" title="워크챗 열기"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a8 8 0 0 1-8 8c-1 0-2.1-.2-3.1-.6L4 20l1-4.2A8 8 0 1 1 20 11.5Z"/></svg><span>워크챗</span><span id="workchatHeaderUnread" class="workchat-header-unread" hidden aria-label="안 읽은 메시지 0개"></span></button>
		
		    <div class="profile-dropdown"
                 th:if="${#authentication != null and #authentication.principal instanceof T(com.tk.app.security.CustomUserDetails)}"
                 th:with="headerMember=${#authentication.principal.member}">
                
                <button type="button" class="team-profile header-profile-trigger" id="profileToggle"
                        aria-expanded="false" aria-controls="profileMenu" title="내 프로필 메뉴">
                    <span class="header-profile-avatar" aria-hidden="true">
                       
                        <img class="header-profile-photo" alt=""
                             th:if="${headerMember.avatar != null and !#strings.isEmpty(headerMember.avatar)}"
                             th:src="@{/uploads/member/{filename}(filename=${headerMember.avatar})}">
                       
                        <span class="header-profile-fallback"
                              th:unless="${headerMember.avatar != null and !#strings.isEmpty(headerMember.avatar)}"
                              th:text="${headerMember.name != null and !#strings.isEmpty(headerMember.name) ? (#strings.length(headerMember.name) > 2 ? #strings.substring(headerMember.name, #strings.length(headerMember.name) - 2) : headerMember.name) : '나'}">나</span>
                    </span>
                   
					<span class="header-profile-label">
						<strong class="header-profile-name"
						        th:text="${headerMember.name}">
						</strong>
					    <small class="header-profile-subtitle">프로필 메뉴</small>
					</span>

                    <svg class="header-profile-chevron" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </button>

                <div class="profile-menu" id="profileMenu" hidden>
                    <th:block th:unless="${area == 'admin'}">
                        <a th:if="${area == 'account'}" th:href="@{/myHome}">마이홈으로</a>
                        <a th:unless="${area == 'account'}" th:href="@{/member/mypage}">마이페이지</a>
                        <a th:href="@{/main}">처음화면으로</a>
                        <div class="profile-menu-divider"></div>
                    </th:block>
                    <form th:action="@{/member/logout}" method="post">
                        <button type="submit" class="logout-button">로그아웃</button>
                    </form>
                </div>
            </div>
		</div>
	</div>

<link th:if="${inWork}" rel="stylesheet" th:href="@{/dist/css/workchat-modal.css(v=24)}">
<link rel="stylesheet" th:href="@{/dist/css/header-profile.css(v=9)}">
<link th:if="${inWork}" rel="stylesheet" th:href="@{/dist/css/organization-modal.css(v=6)}">
<link th:if="${!inWork and area != 'admin'}" rel="stylesheet" th:href="@{/dist/css/site-notice-ticker.css(v=1)}">

<th:block th:if="${inWork}">
	<th:block th:replace="~{work/workchat-modal :: workchatModal}"></th:block>
	<th:block th:replace="~{organization/organization-modal :: organizationModal}"></th:block>
</th:block>

<script type="text/javascript" th:src="@{/dist/js/header.js}"></script>
<script th:if="${inWork}" th:src="@{/dist/js/workchat-modal.js(v=20)}"></script>
<script th:if="${inWork}" th:src="@{/dist/js/organization-modal.js(v=6)}"></script>
<script th:if="${!inWork and area != 'admin'}" th:src="@{/dist/js/site-notice-ticker.js(v=1)}"></script>
</th:block>
</html>
