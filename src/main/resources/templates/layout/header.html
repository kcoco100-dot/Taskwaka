<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<th:block th:fragment="header">
	<div class="team-header">
		<div class="team-header-left">
			<a th:href="@{/main}" class="team-logo">
				<img th:src="@{/dist/images/taskwaka-bear-icon.png}" 
					class="team-logo-image" alt="">
				<span>TASKWAKA</span>
			</a>
			<span class="team-name" th:if="${workspace != null}" 
				th:text="${workspace.subject}">
			</span>
		</div>
		
		
		<div class="team-header-right">
		    <button type="button">알림</button>
		    <button type="button">workchat</button>
		
		    <div class="profile-dropdown">
		        <button type="button" class="team-profile" id="profileToggle"
		                aria-expanded="false" aria-controls="profileMenu">
		            프로필
		        </button>
		
		        <div class="profile-menu" id="profileMenu" hidden>
		            <a th:href="@{/member/mypage}"> 마이페이지 </a>

		            <div class="profile-menu-divider"></div>
		
		            <form th:action="@{/member/logout}" method="post">
		                <button type="submit" class="logout-button"> 로그아웃 </button>
		            </form>
		        </div>
		    </div>
		</div>
	</div>

<script type="text/javascript" th:src="@{/dist/js/header.js}"></script>
</th:block>


	
</html>
