<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout3}">

<th:block layout:fragment="css">
	 <link rel="stylesheet" th:href="@{/dist/css/home.css}">
</th:block>
  	  
<th:block layout:fragment="content">
	<div class="home-layout">
		<nav th:replace="~{layout/homeSidebar::homeSidebar('calendar')}"></nav>
			
		<div class="section">
			<!-- 페이지 제목 영역 -->
			<div class="page-heading">
				<p class="page-description">👉🏻담당 업무의 일정을 확인해보세요.</p>
			</div>
			
			<!-- 콘텐츠 영역 -->
			<div class="page-content">
				<div id="myTaskCalendar" 
					th:data-project-base-url="@{/{domainKey}/project/(domainKey=${domainKey})}"></div>
			</div>
		</div>
		
	</div>
</th:block>

<th:block layout:fragment="aside-container">
	<div class="modal fade" id="personalScheduleModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
				    <h5 class="modal-title">개인 일정 등록</h5>
				    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
				</div>
					<div class="modal-body">
					</div>
			</div>
		</div>
	</div>
</th:block>
 
 <!-- th:inline="javascript" : 컨트롤러가 전달한 데이터를 스크립트에서 사용할 수 있게 해줌 -->
<th:block layout:fragment="script">
	<script th:src="@{/dist/vendor/fullcalendar6/dist/index.global.min.js}"></script>
	<script th:src="@{/dist/vendor/fullcalendar6/dist/locales/ko.global.min.js}"></script>

	<script th:inline="javascript">
		document.addEventListener('DOMContentLoaded', function(){
			const calendarEl = document.getElementById('myTaskCalendar');
			
			// 컨트롤러가 전달한 담당 업무 목록
			// /*[[${myTasks}]]*/ : 타임리프가 실제 조회 결과로 바꾸는 표현식
			const tasks = /*[[${myTasks}]]*/[];
			
			// 개인 일정 업무 목록
			const personalSchedules = /*[[${personalSchedules}]]*/[];
			
			// 스크립트에서 참여 프로젝트 목록 받기
			const participatingProjects = /*[[${participatingProjects}]]*/[];
			
			// 업무 하나씩 FullCalendar 가 사용하는 일정 형태로 변환
			function nextDate(dateString) {
				const [year, month, day] = dateString.split('-').map(Number);
				
				return new Date(Date.UTC(year, month - 1, day + 1)).toISOString().slice(0, 10);
			}
			
			// 업무 일정을 클릭하면 해당 프로젝트로 이동하도록 연결
			const taskEvents = tasks.map(function (task){
				return {
					id: String(task.taskId),
					// 업무명 (진행률%) 로 표시
					title: `${task.title} (${task.progress}%)`,
					start: task.startAt,
					end: nextDate(task.endAt),
					allDay: true,
					url: calendarEl.dataset.projectBaseUrl + task.projectId
				};
			});
			
			// 배열의 map 으로 꺼내기
			const personalEvents = (personalSchedules ?? []).map(function (schedule) {
				return {
					// 개인 일정 ID가 업무 일정 ID와 겹칠 수 있으므로 접두어를 붙여야 함
					id: `personal-${schedule.scheduleId}`,
					title: `${schedule.title}`,
					start: schedule.startAt,
					end: nextDate(schedule.endAt),
					allDay: true
				};
				
			});
			
			// 프로젝트 목록
			const projectEvents = (participatingProjects ?? [])
				.filter(function (project) {
					return project.startAt && project.endAt;
				})
				.map(function (project) {
					return {
					// 개인 일정 ID가 업무 일정 ID와 겹칠 수 있으므로 접두어를 붙여야 함
					id: `project-${project.projectId}`,
					title: `${project.subject}`,
					start: project.startAt,
					end: nextDate(project.endAt),
					allDay: true,
					url: calendarEl.dataset.projectBaseUrl + project.projectId
				};
				
			});
			
			// 한 캘린더에 업무, 개인, 프로젝트 일정을 함께 표시하기 위해서 이벤트 모아두기
			const calendarEvents = [...taskEvents, ...personalEvents, ...projectEvents];
			
			// 업무 일정
			const calendar = new FullCalendar.Calendar(calendarEl, {
				initialView: 'dayGridMonth',
				locale: 'ko',
				height: 'auto',
				headerToolbar: {
					left: 'prev,next today',
					center: 'title',
					right: ''
				},
				events: taskEvents
			});
			
			calendar.render();
		});
	
	</script>

</th:block> 

</html>
