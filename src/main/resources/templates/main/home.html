<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout3}">

<th:block layout:fragment="css">
	 <link rel="stylesheet" th:href="@{/dist/css/home.css}">
</th:block>
  	  
<th:block layout:fragment="content">
	<div class="home-layout">
		<nav th:replace="~{layout/homeSidebar::homeSidebar('calendar')}"></nav>
			
		<div class="section">
			<!-- 페이지 제목 영역 -->
			<div class="page-heading">
				<p class="page-description">👉🏻담당 업무의 일정을 확인해보세요.</p>
				<!-- 모달 열기 버튼 -->
				<button type="button" class="btn btn-primary" data-bs-toggle="modal"
					data-bs-target="#personalScheduleModal">개인 일정 등록</button>
			</div>
			
			<!-- 콘텐츠 영역 -->
			<div class="page-content">
				<div class="home-calendar-legend" aria-label="일정 색상 안내">
					<p class="home-calendar-legend-title">일정 색상 안내</p>
					<ul id="homeCalendarLegend" class="home-calendar-legend-list">
						<li class="home-calendar-legend-item home-calendar-personal-color">
							<span class="home-calendar-legend-dot" aria-hidden="true"></span>
							<span>개인 일정</span>
						</li>
					</ul>
					<p class="home-calendar-legend-help">같은 프로젝트의 업무와 기간은 같은 색으로 표시됩니다.</p>
				</div>
				<div id="myTaskCalendar" 
					th:data-project-base-url="@{/{domainKey}/project/(domainKey=${domainKey})}"
					th:data-projects-url="@{/{domainKey}/home/participating-projects(domainKey=${domainKey})}"></div>
			</div>
		</div>
		
	</div>
</th:block>

<th:block layout:fragment="aside-container">
	<div class="modal fade" id="personalScheduleModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
				    <h5 class="modal-title">개인 일정 등록</h5>
				    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
				</div>
					<div class="modal-body">
						<form id="personalScheduleForm" onsubmit="return false;" 
							th:data-create-url="@{/{domainKey}/home/personal-schedules(domainKey=${domainKey})}">
							<label class="form-label" for="personalScheduleTitle">제목</label>
							<input type="text" id="personalScheduleTitle" name="title" class="form-control" required>
						
							<label class="form-label" for="personalScheduleContent">내용</label>
							<textarea id="personalScheduleContent" name="content" class="form-control" rows="3"></textarea>
							
							<label class="form-label" for="personalScheduleStartAt">시작일</label>
							<input type="date" id="personalScheduleStartAt" name="startAt" class="form-control" required>
							
							<label class="form-label" for="personalScheduleEndAt">종료일</label>
							<input type="date" id="personalScheduleEndAt" name="endAt" class="form-control" required>
						</form>
					</div>
						
						<div class="modal-footer">
							<button type="button" id="personalScheduleDeleteBtn" class="btn btn-outline-danger me-auto d-none">삭제</button>
							<button type="button" id="personalScheduleSubmitBtn" class="btn btn-primary">등록</button>
							<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
						</div>
			</div>
		</div>
	</div>
</th:block>
 
 <!-- th:inline="javascript" : 컨트롤러가 전달한 데이터를 스크립트에서 사용할 수 있게 해줌 -->
<th:block layout:fragment="script">
	<script th:src="@{/dist/vendor/fullcalendar6/dist/index.global.min.js}"></script>
	<script th:src="@{/dist/vendor/fullcalendar6/dist/locales/ko.global.min.js}"></script>
	<script th:src="@{/dist/js/util-async.js}"></script>
	<script th:src="@{/dist/js/util-bootstrap.js}"></script>
	
	<script th:inline="javascript">
		document.addEventListener('DOMContentLoaded', async function(){
			const calendarEl = document.getElementById('myTaskCalendar');
			
			// 등록 이벤트
			const personalScheduleForm = document.getElementById('personalScheduleForm');
			const personalScheduleSubmitBtn = document.getElementById('personalScheduleSubmitBtn');
			const personalScheduleDeleteBtn = document.getElementById('personalScheduleDeleteBtn');
			
			// 선택한 개인 일정 번호, null이면 새 일정 등록
			let selectedPersonalScheduleId = null;
			let personalScheduleBusy = false;

			// 저장·삭제 요청이 겹치지 않도록 두 버튼을 함께 제어
			function setPersonalScheduleBusy(busy) {
				personalScheduleBusy = busy;
				personalScheduleSubmitBtn.disabled = busy;
				personalScheduleDeleteBtn.disabled = busy;
			}

			// 처리 중에는 모달이 닫혀 선택한 일정이 초기화되는 것을 방지
			document.getElementById('personalScheduleModal')
				.addEventListener('hide.bs.modal', function(event) {
					if (personalScheduleBusy) {
						event.preventDefault();
					}
				});
			
			// 모달을 닫으면 새 일정 등록 상태로 복구
			document.getElementById('personalScheduleModal')
				.addEventListener('hidden.bs.modal', function() {
					personalScheduleForm.reset();
					// 모달을 닫으면 선택한 일정 번호도 초기화
					selectedPersonalScheduleId = null;
					document.querySelector('#personalScheduleModal .modal-title').textContent = '개인 일정 등록';
					personalScheduleSubmitBtn.textContent = '등록';
					personalScheduleSubmitBtn.disabled = false;
					personalScheduleDeleteBtn.classList.add('d-none');
					personalScheduleDeleteBtn.disabled = false;
				});
			
			personalScheduleSubmitBtn.addEventListener('click', async function() {
				if (personalScheduleBusy) {
					return;
				}

				// HTML 입력 조건 검사
				if(!personalScheduleForm.reportValidity()) {
					return;
				}
				
				// 서버에 보낼 입력값을 객체로 모으기
				const scheduleData = {
					title: personalScheduleForm.elements.namedItem('title').value,
					content: personalScheduleForm.elements.namedItem('content').value,
					startAt: personalScheduleForm.elements.namedItem('startAt').value,
					endAt : personalScheduleForm.elements.namedItem('endAt').value
				};
				
				// 선택한 일정 번호가 있으면 수정, 없으면 등록
				const isEditing = selectedPersonalScheduleId !== null;
				const requestUrl = isEditing
					? personalScheduleForm.dataset.createUrl + '/' + encodeURIComponent(selectedPersonalScheduleId)
					: personalScheduleForm.dataset.createUrl;

				setPersonalScheduleBusy(true);
				try {
					const saveCount = await fetchRequest(
						requestUrl,
						isEditing ? 'PUT' : 'POST',
						scheduleData,
						'json',
						'json'
					);

					if (saveCount === 1) {
						const refreshed = await refreshPersonalSchedules();

						if (refreshed) {
							alert(isEditing ? '일정이 수정되었습니다.' : '일정이 등록되었습니다.');
						} else {
							alert('일정은 저장되었지만 화면을 갱신하지 못했습니다. 새로고침해 주세요.');
						}

						setPersonalScheduleBusy(false);
						hideModal('#personalScheduleModal');
					} else if (saveCount !== undefined) {
						alert('일정 저장 결과를 확인하지 못했습니다.');
					}
				} catch (err) {
					console.error(err);
					alert('일정 저장 결과를 확인하지 못했습니다.');
				} finally {
					setPersonalScheduleBusy(false);
				}
			});

			// 선택한 HOME 개인 일정만 삭제
			personalScheduleDeleteBtn.addEventListener('click', async function() {
				if (personalScheduleBusy || selectedPersonalScheduleId === null) {
					return;
				}

				const scheduleId = selectedPersonalScheduleId;
				if (!confirm('선택한 개인 일정을 삭제할까요?')) {
					return;
				}

				setPersonalScheduleBusy(true);
				try {
					const deleteCount = await fetchRequest(
						personalScheduleForm.dataset.createUrl + '/' + encodeURIComponent(scheduleId),
						'DELETE'
					);

					if (deleteCount === 1) {
						const refreshed = await refreshPersonalSchedules();
						alert(refreshed
							? '일정이 삭제되었습니다.'
							: '일정은 삭제되었지만 화면을 갱신하지 못했습니다. 새로고침해 주세요.');
						setPersonalScheduleBusy(false);
						hideModal('#personalScheduleModal');
					} else if (deleteCount !== undefined) {
						alert('일정 삭제 결과를 확인하지 못했습니다.');
					}
				} catch (err) {
					console.error(err);
					alert('일정 삭제 결과를 확인하지 못했습니다.');
				} finally {
					setPersonalScheduleBusy(false);
				}
			});
			
			// 컨트롤러가 전달한 담당 업무 목록
			// /*[[${myTasks}]]*/ : 타임리프가 실제 조회 결과로 바꾸는 표현식
			const tasks = /*[[${myTasks}]]*/[];
			
			// 개인 일정 업무 목록
			let personalSchedules = [];
			
			try {
				const schedules = await fetchRequest(
						personalScheduleForm.dataset.createUrl,
						'GET'
				);
				
				if(Array.isArray(schedules) == true) {
					personalSchedules = schedules;
				}
			} catch(err) {
				console.error(err);
			}
			
			// 스크립트에서 참여 프로젝트 목록 받기
			let participatingProjects = []; 
			
			try {
				const projects = await fetchRequest(
						calendarEl.dataset.projectsUrl,
						'GET'
				);
				
				if(Array.isArray(projects) == true) {
					participatingProjects = projects;
				}
			} catch(err) {
				console.error(err);
			}
			
			// 프로젝트 ID를 기준으로 색상을 고정하고, 개인 일정의 살구색과 구분한다.
			function projectColors(projectId) {
				const key = String(projectId);
				let hash = 0;
				for(let i = 0; i < key.length; i++) {
					hash = (Math.imul(hash, 31) + key.charCodeAt(i)) | 0;
				}
				const hue = 120 + (((hash >>> 0) * 137.508) % 360) * 200 / 360;
				return {
					backgroundColor: `hsl(${hue}, 65%, 91%)`,
					borderColor: `hsl(${hue}, 42%, 55%)`,
					textColor: '#203548'
				};
			}
			
			// 조회된 업무의 프로젝트도 포함하되, 같은 프로젝트는 범례에 한 번만 표시한다.
			const legendProjects = new Map();
				tasks.forEach(function (task) {
					legendProjects.set(String(task.projectId), task.subject || `프로젝트 ${task.projectId}`);
				});
				
				participatingProjects.forEach(function (project) {
					legendProjects.set(String(project.projectId), project.subject || `프로젝트 ${project.projectId}`);
				});
				
			const legendEl = document.getElementById('homeCalendarLegend');
			
			legendProjects.forEach(function (subject, projectId) {
				const colors = projectColors(projectId);
				const item = document.createElement('li');
				
				item.className = 'home-calendar-legend-item';
				item.style.backgroundColor = colors.backgroundColor;
				item.style.borderColor = colors.borderColor;
				item.style.color = colors.textColor;
				
				const dot = document.createElement('span');
				
				dot.className = 'home-calendar-legend-dot';
				dot.style.backgroundColor = colors.borderColor;
				dot.setAttribute('aria-hidden', 'true');
				
				const name = document.createElement('span');
				
				name.textContent = subject;
				item.append(dot, name);
				legendEl.append(item);
			});
			
			// 업무 하나씩 FullCalendar 가 사용하는 일정 형태로 변환
			function nextDate(dateString) {
				const [year, month, day] = dateString.split('-').map(Number);
				
				return new Date(Date.UTC(year, month - 1, day + 1)).toISOString().slice(0, 10);
			}
			
			// 업무 일정을 클릭하면 해당 프로젝트로 이동하도록 연결
			const taskEvents = tasks.map(function (task){
				return {
					id: String(task.taskId),
					// 업무명 (진행률%) 로 표시
					title: `${task.title} (${task.progress}%)`,
					start: task.startAt,
					end: nextDate(task.endAt),
					allDay: true,
					...projectColors(task.projectId),
					url: calendarEl.dataset.projectBaseUrl + task.projectId
				};
			});
			
			// 배열의 map 으로 꺼내기
			function createPersonalEvents(schedules) {
				return (schedules ?? []).map(function (schedule) {
				return {
					// 개인 일정 ID가 업무 일정 ID와 겹칠 수 있으므로 접두어를 붙여야 함
					id: `personal-${schedule.scheduleId}`,
					title: `${schedule.title}`,
					start: schedule.startAt,
					end: nextDate(schedule.endAt),
					allDay: true,
					classNames: ['home-calendar-personal-color'],
					// 개인 일정 클릭 처리에 사용할 정보와 원래 날짜
					extendedProps: {
						scheduleType: 'PERSONAL',
						scheduleId: schedule.scheduleId,
						content: schedule.content ?? '',
						startAt: schedule.startAt,
						endAt: schedule.endAt
					}
				};
				
				});
			}

			// 최초 화면에 표시할 개인 일정
			const personalEvents = createPersonalEvents(personalSchedules);
				
			
			// 프로젝트 목록
			const projectEvents = (participatingProjects ?? [])
				.filter(function (project) {
					return project.startAt && project.endAt;
				})
				.map(function (project) {
					return {
					// 개인 일정 ID가 업무 일정 ID와 겹칠 수 있으므로 접두어를 붙여야 함
					id: `project-${project.projectId}`,
					title: `${project.subject}`,
					start: project.startAt,
					end: nextDate(project.endAt),
					allDay: true,
					...projectColors(project.projectId),
					url: calendarEl.dataset.projectBaseUrl + project.projectId
				};
				
			});
			
			// 한 캘린더에 업무, 개인, 프로젝트 일정을 함께 표시하기 위해서 이벤트 모아두기
			const calendarEvents = [...taskEvents, ...personalEvents, ...projectEvents];
			
			// 업무 일정
			const calendar = new FullCalendar.Calendar(calendarEl, {
				initialView: 'dayGridMonth',
				locale: 'ko',
				height: 'auto',
				headerToolbar: {
					left: 'prev,next today',
					center: 'title',
					right: ''
				},
				events: calendarEvents,
				eventClick: function(info) {
					const schedule = info.event.extendedProps;
					
					// 개인 일정만 모달로 열기
					if (schedule.scheduleType !== 'PERSONAL') {
						return;
					}
					
					info.jsEvent.preventDefault();
					if (personalScheduleBusy) {
						return;
					}
					
					// 클릭한 개인 일정 번호 보관
					selectedPersonalScheduleId = schedule.scheduleId;
					
					// 입력칸에 선택한 일정 내용 채우기
					personalScheduleForm.elements.namedItem('title').value = info.event.title;
					personalScheduleForm.elements.namedItem('content').value = schedule.content;
					personalScheduleForm.elements.namedItem('startAt').value = schedule.startAt;
					personalScheduleForm.elements.namedItem('endAt').value = schedule.endAt;

					// 선택한 개인 일정을 수정하는 상태로 전환
					document.querySelector('#personalScheduleModal .modal-title').textContent = '개인 일정 수정';
					personalScheduleSubmitBtn.textContent = '수정';
					personalScheduleSubmitBtn.disabled = false;
					personalScheduleDeleteBtn.classList.remove('d-none');
					personalScheduleDeleteBtn.disabled = false;
					showModal('#personalScheduleModal');
				}
			});
			
			calendar.render();
			
			// 개인 일정만 다시 조회하여 현재 캘린더에 반영
			async function refreshPersonalSchedules() {
				try {
					const schedules = await fetchRequest(
						personalScheduleForm.dataset.createUrl,
						'GET'
					);

					if (!Array.isArray(schedules)) {
						return false;
					}

					const events = createPersonalEvents(schedules);

					calendar.batchRendering(function() {
						calendar.getEvents()
							.filter(event => event.extendedProps.scheduleType === 'PERSONAL')
							.forEach(event => event.remove());

						events.forEach(event => calendar.addEvent(event));
					});

					personalSchedules = schedules;
					return true;
				} catch (err) {
					console.error(err);
					return false;
				}
			}
		});
	
	</script>

</th:block> 

</html>
