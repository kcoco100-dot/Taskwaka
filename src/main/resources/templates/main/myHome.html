<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout3}">

<th:block layout:fragment="css">
    <link rel="stylesheet" th:href="@{/dist/css/mainHome.css}">
    <link rel="stylesheet" th:href="@{/dist/css/team-create.css}">
</th:block>

<th:block layout:fragment="content">
	<div class="mainHome myHome-page">
        <div class="mainHome-heading">
            <span class="mainHome-label">TASKWAKA</span>
				<h1>참여 중인 워크</h1>
				<p>업무를 확인할 워크를 선택하세요.</p>
        </div>
		
		<div class="mainHome-menu">
			<a th:if="${#lists.isEmpty(workLists)}" th:href="@{/work}" class="team-card team-card-create">
			    <span class="team-card-icon" aria-hidden="true">
			        <i class="bi bi-plus-lg"></i>
			    </span>
			    <span class="team-card-title">참여 중인 워크가 없습니다.</span>
			    <span class="team-card-description">
			        새 워크를 만들거나 초대를 받아 참여해보세요.
			    </span>
			    <span class="team-card-action">새 워크 만들기 →</span>
			</a>
		
			<a th:each="work : ${workLists}"
			   th:href="${work.active == 'Y'} ? @{/{domainKey}/home/dashboard(domainKey=${work.domainKey})} : null"
			   class="team-card team-card-list"
			   th:classappend="${work.active != 'Y'} ? 'is-disabled' : ''"
			   th:attr="aria-disabled=${work.active != 'Y'}">
				<span class="team-card-icon" aria-hidden="true">
					<i class="bi bi-people"></i>
				</span>
				<span class="team-card-title"
				      th:text="${work.subject}">워크 이름</span>
				<span class="team-card-description"
				      th:text="${work.active == 'Y' ? '참여 중인 팀과 팀의 일정을 확인해보세요.'
				          : '정지 사유: ' + (#strings.isEmpty(work.reason) ? '등록된 사유가 없습니다.' : work.reason)}">
				</span>
				<span class="team-card-action"
				      th:text="${work.active == 'Y' ? '내 팀 보기 →' : '이용 정지'}">
				</span>
			</a>
		</div>
	</div>
</th:block>

</html>
