<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout3}">

<th:block layout:fragment="css">
    <link rel="stylesheet" th:href="@{/dist/css/home.css}">
    <link rel="stylesheet" th:href="@{/dist/manage/manage.css}">
    <link rel="stylesheet" th:href="@{/dist/css/page-shell.css}">
</th:block>

<th:block layout:fragment="content">
    <div class="home-layout manage-layout">
        <nav th:replace="~{layout/homeSidebar::homeSidebar('noticeEdit')}"></nav>

        <div class="section shell-section">
            <div class="page-heading">
                <h1 class="page-title">공지사항 수정</h1>
                <p class="page-description">공지사항의 내용을 수정하세요.</p>
            </div>
            
			<form id="noticeEditForm" method="post" enctype="multipart/form-data"
				th:action="@{/{domainKey}/home/noticeEdit(domainKey=${domainKey})}">
			    <input type="hidden" name="noticeId" th:value="${notice.noticeId}">
			
			    <div class="mb-3">
			        <label for="noticeTitle" class="form-label">제목</label>
			        <input type="text" id="noticeTitle" name="title" class="form-control"
			               maxlength="200" required th:value="${notice.title}">
			    </div>
			
			    <div class="mb-3">
			        <label for="noticeContent" class="form-label">내용</label>
			        <textarea id="noticeContent" name="content" class="form-control"
			                  rows="12" required th:text="${notice.content}"></textarea>
			    </div>
			    
				<p class="notice-attachments">
				    첨부파일
				    <span th:if="${#lists.isEmpty(noticeFile)}">첨부파일이 없습니다.</span>
				    <span th:each="file : ${noticeFile}">
				    		<span th:text="${file.originalName}">파일명</span>
				    		<label>
				    			<input type="checkbox" name="deleteFileIds" th:value="${file.noticeFileId}">
				    			삭제
				    		</label>
				    	</span>
				</p>
				
				<label>
					<input type="file" name="files" multiple="multiple">
				</label>
			
			    <div class="shell-actions">
			        <button type="submit" class="shell-action shell-action-primary">
			            수정완료
			        </button>
			
			        <button type="reset" class="shell-action">
			            초기화
			        </button>
			
			        <a th:href="@{/{domainKey}/home/notice(domainKey=${domainKey})}" class="shell-action">
			            목록으로
			        </a>
			    </div>
			</form>
			
			<div th:if="${errorMessage != null}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
        </div>
    </div>
</th:block>

<th:block layout:fragment="script"></th:block>
</html>
