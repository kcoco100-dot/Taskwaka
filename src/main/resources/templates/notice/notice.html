<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout3}">

<th:block layout:fragment="css">
    <link rel="stylesheet" th:href="@{/dist/css/home.css}">
    <link rel="stylesheet" th:href="@{/dist/manage/manage.css}">
    <link rel="stylesheet" th:href="@{/dist/css/page-shell.css}">
    <link rel="stylesheet" th:href="@{/dist/css/notice.css}">
</th:block>

<th:block layout:fragment="content">
    <div class="home-layout notice-layout">
        <nav th:replace="~{layout/homeSidebar::homeSidebar('notice')}"></nav>

        <div class="section notice-section">
            <div class="notice-heading">
                <span class="notice-label">WORKSPACE</span>
                <h1 class="notice-page-title">공지사항</h1>
                <p class="notice-description">
                    함께하는 워크의 소식과 안내를 확인하세요.
                </p>
            </div>

            <section class="notice-panel" aria-labelledby="notice-list-title">
                <div class="notice-panel-header">
                    <div class="notice-panel-heading">
                        <span class="notice-panel-icon" aria-hidden="true">
                            <i class="bi bi-megaphone"></i>
                        </span>

                        <div>
                            <h2 id="notice-list-title">워크 공지</h2>
                            <p>현재 워크에 공개된 공지사항입니다.</p>
                        </div>
                    </div>

                    <a th:if="${manageWorkspaceRole == 70 or manageWorkspaceRole == 50}"
                       th:href="@{/{domainKey}/home/noticeCreate(domainKey=${domainKey})}"
                       class="shell-action shell-action-primary">
				       공지 등록하기
                    </a>
                </div>

				<form method="get"
				      th:action="@{/{domainKey}/home/notice(domainKey=${domainKey})}"
				      class="row g-3 align-items-end p-3 m-0 border-bottom">
				    <div class="col-12 col-md-3">
				        <label for="noticeSearchType" class="form-label">검색 조건</label>
				        <select id="noticeSearchType" name="schType" class="form-select">
				            <option value="all" th:selected="${schType == 'all'}">전체</option>
				            <option value="title" th:selected="${schType == 'title'}">제목</option>
				            <option value="content" th:selected="${schType == 'content'}">내용</option>
				        </select>
				    </div>
				
				    <div class="col-12 col-md-6">
				        <label for="noticeSearchKeyword" class="form-label">검색어</label>
				        <input id="noticeSearchKeyword" name="kwd" type="search"
				               class="form-control" maxlength="100"
				               placeholder="검색어를 입력하세요" th:value="${kwd}">
				    </div>
				
				    <div class="col-12 col-md-3 d-flex gap-2">
				        <button type="submit" class="shell-action shell-action-primary">
				            검색
				        </button>
				        <a th:href="@{/{domainKey}/home/notice(domainKey=${domainKey})}"
				           class="shell-action">
				            초기화
				        </a>
				    </div>
				</form>

                <!-- 공지가 없거나 아직 조회가 연결되지 않은 경우 -->
                <div class="notice-empty"
                     th:if="${notices == null or #lists.isEmpty(notices)}">

                    <span class="notice-empty-icon" aria-hidden="true">
                        <i class="bi bi-inbox"></i>
                    </span>

                    <h3 th:text="${#strings.isEmpty(kwd) ? '아직 공개된 공지가 없습니다' : '검색 결과가 없습니다'}">
                        아직 공개된 공지가 없습니다
                    </h3>
                    <p th:text="${#strings.isEmpty(kwd) ? 
                    		'새로운 공지가 등록되면 이곳에서 확인할 수 있습니다.' : '다른 검색어나 검색 조건으로 다시 검색해 주세요.'}">
                        새로운 공지가 등록되면 이곳에서 확인할 수 있습니다.
                    </p>
                </div>

                <div class="notice-table-wrap" th:unless="${notices == null or #lists.isEmpty(notices)}">
                    <table class="notice-table">
                        <caption class="visually-hidden">
                            현재 워크의 공개 공지 목록
                        </caption>

                        <thead>
                            <tr>
                                <th scope="col">공지 제목</th>
                                <th scope="col" class="notice-author-col">작성자</th>
                                <th scope="col" class="notice-date-col">등록일</th>
                                <th scope="col" class="notice-views-col">조회수</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="notice : ${notices}">
                                <td>
                                    <div class="notice-title-cell">
                                        <span class="notice-type">워크</span>
                                        <a class="notice-item-title" 
                                        		 th:href="@{/{domainKey}/home/noticeDetail(domainKey=${domainKey}, noticeId=${notice.noticeId})}"
                                        	     th:text="${notice.title}">
                                            공지 제목
                                        </a>
                                    </div>
                                </td>

                                <td class="notice-author-col" th:text="${notice.authorName}">
                                    작성자
                                </td>

                                <td class="notice-date-col" th:text="${notice.createdAt}">
                                    등록일
                                </td>

                                <td class="notice-views-col" th:text="${notice.viewCount}">
                                    0
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <nav class="notice-pagination"
				     aria-label="공지사항 페이지 이동"
				     th:if="${!#strings.isEmpty(paging)}"
				     th:utext="${paging}">
				</nav>
            </section>
        </div>
    </div>
</th:block>

<th:block layout:fragment="aside-container">
	<th:block th:replace="~{common/util/confirm::confirm}"></th:block>
</th:block>

<th:block layout:fragment="script">
<script th:inline="javascript">
	document.addEventListener('DOMContentLoaded', () => {
		const growthExpMessage = /*[[${growthExpMessage}]]*/ null;
		
		if(growthExpMessage != null) {
			showToast(growthExpMessage);
		}
	});
	
	console.table(
		    [...document.querySelectorAll('html, body, body *')]
		        .filter(el =>
		            el.scrollHeight > el.clientHeight + 1 &&
		            /auto|scroll/.test(getComputedStyle(el).overflowY)
		        )
		        .map(el => ({
		            tag: el.tagName,
		            class: el.className,
		            height: el.clientHeight,
		            contentHeight: el.scrollHeight,
		            overflowY: getComputedStyle(el).overflowY,
		            maxHeight: getComputedStyle(el).maxHeight
		        }))
		);
</script>
</th:block>
</html>
