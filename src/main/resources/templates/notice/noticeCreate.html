<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout3}">

<th:block layout:fragment="css">
    <link rel="stylesheet" th:href="@{/dist/css/home.css}">
    <link rel="stylesheet" th:href="@{/dist/manage/manage.css}">
    <link rel="stylesheet" th:href="@{/dist/css/page-shell.css}">
    <link rel="stylesheet" th:href="@{/dist/vendor/quill/css/quill.snow.css}">
</th:block>

<th:block layout:fragment="content">
    <div class="home-layout manage-layout">
        <nav th:replace="~{layout/homeSidebar::homeSidebar('noticeCreate')}"></nav>

        <div class="section shell-section notice-create-section">
            <div class="page-heading">
                <h1 class="page-title">공지사항 등록</h1>
                <p class="page-description">새로운 공지사항을 작성하세요.</p>
            </div>

			<form method="post" th:action="@{/{domainKey}/home/noticeCreate(domainKey=${domainKey})}"
				  enctype="multipart/form-data">

	            <div class="shell-content">
	            		<label for="noticeTitle" class="form-label">공지 제목</label>
                		<input th:value="${notice.title}" name="title" type="text"
                			id="noticeTitle" class="form-control" maxlength="200" required>
                			
                		<label id="noticeContentLabel" class="form-label">공지 내용</label>
					<div id="noticeEditor" class="editor"
					     th:data-upload-url="@{/editor/upload}"></div>
					          
	            		<textarea id="noticeContent" name="content" hidden
          					th:text="${notice.content}"></textarea>
          					
	            		<label for="noticeFiles" class="form-label">첨부파일(선택)</label>
	            		<input type="file" id="noticeFiles" name="files" class="form-control"
	            			   multiple="multiple" accept=".gif, .png, .txt, .pdf, .doc, .docx, .ppt, .pptx, .xls, .xlsx">
	            </div>

			    <div class="shell-actions">
			        <button type="submit" class="shell-action shell-action-primary">
			            등록하기
			        </button>
			
			        <button type="reset" class="shell-action">
			            초기화
			        </button>
				
		            <div class="shell-actions">
		                <a th:href="@{/{domainKey}/home/notice(domainKey=${domainKey})}" class="shell-action">목록으로</a>
		            </div>
			    </div>
			</form>
			
			<div th:if="${errorMessage != null}" class="alert alert-danger"
				 role="alert" th:text="${errorMessage}"></div>
			
	    </div>
        
     </div>

</th:block>

<!-- 퀼 에디터 -->
<th:block layout:fragment="script">
    <script th:src="@{/dist/vendor/quill/js/quill.js}"></script>

	<script>
		// Quill 에디터 객체 생성
		const noticeQuill = new Quill('#noticeEditor', {
		    // 테마 적용
			theme: 'snow',
			// 내용이 비어있을때 넣어줄 문구
		    placeholder: '공지 내용을 입력하세요.',
		    // 사용할 에디터 기능설정
		    modules: {
		        toolbar: [ // 툴바에 표시할 버튼
		            ['bold', 'italic', 'underline'],
		            [{ list: 'ordered' }, { list: 'bullet' }],
		            ['image'],['clean']
		        ]
		    }
		});
		// 실제 입력 영역을 공지 내용 라벨과 연결해 
		// 화면 읽기 프로그램이 입력 영역의 이름을 알 수 있게
		noticeQuill.root.setAttribute('aria-labelledby', 'noticeContentLabel');
		
		const noticeContent = document.getElementById('noticeContent');
		// 검증 실패로 돌아온 본문 HTML을 서식과 이미지로 복원
		noticeQuill.clipboard.dangerouslyPasteHTML(noticeContent.value, 'silent');

		// 복원한 내용이 실행 취소로 지워지지 않도록 기록 초기화
		noticeQuill.history.clear();
		let noticeImageUploadCount = 0;
		
		noticeContent.form.addEventListener('submit', (event) => {
			if (noticeImageUploadCount > 0) {
			    event.preventDefault();
			    alert('이미지 업로드가 끝난 후 등록해 주세요.');
			    return;
			}
			
			// 본문이 비었으면 전송 막기
			// 글자와 이미지가 모두 없을 때만 빈 본문으로 처리
			if (!noticeQuill.getText().trim() && 
					!noticeQuill.root.querySelector('img')) {
				event.preventDefault();
				alert('공지 내용을 입력하세요.');
				noticeQuill.focus();
				return;
			}
			
			// 내용이 있으면 서식을 포함한 HTML 을 숨김 textarea 에 넣기
			// getSemanticHTML() : Quill 에서 작성한 내용을 서식이 포함된 HTML 문자열로 꺼내는 메서드 
			noticeContent.value = noticeQuill.getSemanticHTML();
		});
		
		// 초기화 버튼을 Quill에 연결
		const initialNoticeContents = noticeQuill.getContents();
		
		noticeContent.form.addEventListener('reset', () => {
			// 이벤트 객체를 사용할 일이 없어서 매개변수를 생략
			noticeQuill.setContents(initialNoticeContents);
		});
		
		// 업로드 파일 이미지
		async function uploadNoticeImage(file, uploadUrl) {
			const formData = new FormData();
			formData.append('imageFile', file);
			
			const response = await fetch(uploadUrl, {
				method: 'POST',
				body: formData
			});
			
			// 요청이 실패했거나, 다른 주소로 이동됐다면
			if(!response.ok || response.redirected) {
				throw new Error('이미지 업로드에 실패했습니다.');
			}
			
			// response.json(): 응답 본문을 JSON으로 해석
			// 본문이 비었거나 JSON 형식이 아니면 null을 반환
			const result = await response.json().catch(() => null);
			
			// !result : 응답을 읽지 못하거나
			// result.imageUrl != 'string' : 이미지 주소가 없거나 문자열이 아니거나
			// !result.imageUrl.trim() : 이미지 주소가 빈 문자열이거나 공백뿐일때
			if(!result || typeof result.imageUrl != 'string' || !result.imageUrl.trim()) {
				throw new Error('업로드된 이미지 주소를 확인할 수 없습니다.');	
			}
			
			return result.imageUrl;
		}
			// 툴바 기능 가져오기
			// 이미지 버튼 클릭 시 동작 지정
			noticeQuill.getModule('toolbar').addHandler('image', () => {
			    // 에디터에 초점. 이미지를 넣을 위치
				const range = noticeQuill.getSelection(true);
			    // 파일 선택에 사용할 input
			    const input = document.createElement('input');
			    input.type = 'file';
			    input.accept = 'image/*';
	
			    // 파일 선택 시 업로드 처리
			    input.addEventListener('change', async () => {
			        // 첫번째 파일 꺼내기
			    		const file = input.files[0];
			        // 파일이 없으면 리턴
			        if (!file) return;
			        
			        noticeImageUploadCount++;
	
			        try {
			        		// 주소 읽기
			            const uploadUrl =
			                    document.getElementById('noticeEditor').dataset.uploadUrl;
			            // 파일 업로드
			        		const imageUrl = await uploadNoticeImage(file, uploadUrl);
			            // 에디터 끝 줄바꿈 앞 위치 구하기
			            const lastIndex = noticeQuill.getLength() - 1;
			            // 기억한 커서 위치가 있으면 사용하고 없으면 본문 끝을 사용함
			            const index = Math.min(range ? range.index : lastIndex, lastIndex);
	
			            // 이미지 넣기
			            noticeQuill.insertEmbed(index, 'image', imageUrl, 'user');
			            // 이미지 뒤로 커서 옮기기
			            noticeQuill.setSelection(index + 1, 0, 'user');
			        } catch (error) {
			            alert(error.message);
			        } finally {
			        		// 이미지 업로드가 끝나기 전에 공지가 등록되는 것을 방지
			        		noticeImageUploadCount--;
			        }
			    });
				
			    // 파일창 열기
			    input.click();
			});
		
	</script>
</th:block>
</html>
