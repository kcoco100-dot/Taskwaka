
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비밀번호 찾기 | TASKWAKA</title>
<link rel="icon" th:href="@{/dist/images/taskwaka-bear-icon.png}">
<link rel="stylesheet" th:href="@{/dist/css/member-find.css}">
</head>

<body class="find-page">

	<main class="find-card">

		<div class="find-brand">
			<img th:src="@{/dist/images/taskwaka-bear-icon.png}" alt=""> <span>TASKWAKA</span>
		</div>

		<h1>비밀번호 재설정</h1>
		<p class="find-description">
			가입한 아이디와 이메일을 입력해 주세요.<br> 등록된 이메일로 비밀번호 재설정 링크를 보내드립니다.
		</p>

		<form id="pwdFindForm" th:action="@{/member/pwdFind}" method="post">

			<div class="find-field">
				<label for="loginId">아이디</label> <input type="text" id="loginId"
					name="login_id" placeholder="아이디를 입력하세요" required>
			</div>

			<div class="find-field">
				<label for="memberEmail">가입 이메일</label> <input type="email"
					id="memberEmail" name="email" placeholder="이메일을 입력하세요" required>
			</div>

			<button type="submit" class="find-submit" id="sendBtn">재설정
				링크 받기</button>

		</form>

		<div class="result-box" id="resultBox" role="status"
			aria-live="polite" hidden></div>

		<div class="find-links">
			<a th:href="@{/member/login}">로그인으로 돌아가기</a> <span>|</span> <a
				th:href="@{/member/idFind}">아이디 찾기</a>
		</div>

	</main>

	<script>
    const form = document.getElementById("pwdFindForm");
    const resultBox = document.getElementById("resultBox");
    const sendBtn = document.getElementById("sendBtn");
    
    if (new URLSearchParams(window.location.search).get("expired") === "1") {
        resultBox.textContent = "재설정 링크가 만료되었거나 사용할 수 없습니다. 다시 요청해 주세요.";
        resultBox.hidden = false;
    }

    form.addEventListener("submit", function(e) {
        e.preventDefault();

        const formData = new URLSearchParams(new FormData(form));

        sendBtn.disabled = true;
        resultBox.hidden = true;

        fetch(form.action, {
            method: "POST",
            body: formData
        })
        .then(response => {
            if (!response.ok) {
                throw new Error("REQUEST_FAIL");
            }
            return response.text();
        })
        .then(data => {
            resultBox.hidden = false;
            resultBox.style.color = data === "OK" ? "#526849" : "#c0392b";
            resultBox.style.backgroundColor = data === "OK" ? "#f3f5ef" : "#fff1f0";

            if (data === "OK") {
                resultBox.textContent = "비밀번호 재설정 안내 메일을 발송했습니다.";
            } else if (data === "NOT_FOUND") {
                resultBox.textContent = "입력하신 정보와 일치하는 계정을 찾을 수 없습니다.";
            } else if (data === "TOO_MANY") {
                resultBox.textContent = "요청이 많습니다. 잠시 후 다시 시도해 주세요.";
            } else {
                resultBox.textContent = "요청을 처리하지 못했습니다.";
            }
        })
        .catch(error => {
            resultBox.hidden = false;
            resultBox.textContent = "서버 요청 중 오류가 발생했습니다.";
            console.error(error);
        })
        .finally(() => {
            sendBtn.disabled = false;
        });
    });
</script>

</body>
</html>
