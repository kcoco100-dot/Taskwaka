
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>비밀번호 재설정 | TASKWAKA</title>
    <link rel="icon" th:href="@{/dist/images/taskwaka-favicon.png}">
    <link rel="stylesheet" th:href="@{/dist/css/member-find.css}">
</head>

<body class="find-page">

    <main class="find-card">

        <div class="find-brand">
            <img th:src="@{/dist/images/taskwaka-bear-icon.png}" alt="">
            <span>TASKWAKA</span>
        </div>

        <h1>새 비밀번호 설정</h1>

        <p class="find-description">
            새로운 비밀번호를 입력해 주세요.
            <br>
            영문 대문자, 소문자, 숫자, 특수문자를 포함해
            8~20자로 설정해 주세요.
        </p>

        <form id="resetPasswordForm"
              th:action="@{/member/reset-password}"
              method="post">

            <input type="hidden" name="token" th:value="${token}">

            <div class="find-field">
                <label for="newPassword">새 비밀번호</label>
                <input type="password" id="newPassword" name="newPassword" placeholder="새 비밀번호를 입력하세요" minlength="8" maxlength="20" required>
            </div>

            <div class="find-field">
                <label for="confirmPassword">새 비밀번호 확인</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="비밀번호를 다시 입력하세요" required>
            </div>

            <button type="submit" class="find-submit">
                비밀번호 변경하기
            </button>

        </form>
		
		<div class="result-box" th:if="${errorMessage != null}" th:text="${errorMessage}" role="alert"></div>
        <div class="result-box" id="resultBox" role="status" aria-live="polite" hidden></div>

        <div class="find-links">
            <a th:href="@{/member/login}">로그인으로 돌아가기</a>
        </div>

    </main>

    <script>

	    const form = document.getElementById("resetPasswordForm");
	    const resultBox = document.getElementById("resultBox");
	    
	    form.addEventListener("input", function() {
	        resultBox.hidden = true;
	        resultBox.textContent = "";
	    });
	
	    form.addEventListener("submit", function(e) {
	        const password = document.getElementById("newPassword").value;
	        const confirm = document.getElementById("confirmPassword").value;
	
	        const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*])[a-zA-Z0-9!@#$%^&*]{8,20}$/;
	
	        resultBox.hidden = true;
	
	        if (password !== confirm) {
	            e.preventDefault();
	            resultBox.textContent = "비밀번호가 일치하지 않습니다.";
	            resultBox.hidden = false;
	            return;
	        }
	
	        if (!passwordRegex.test(password)) {
	            e.preventDefault();
	            resultBox.textContent = "영문 대소문자, 숫자, 특수문자를 포함해 8~20자로 입력해 주세요.";
	            resultBox.hidden = false;
	            return;
	        }
	    });

    </script>

</body>
</html>
