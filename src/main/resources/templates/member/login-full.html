
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 | TASKWAKA</title>
    <link th:replace="~{layout/header :: favicon}">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/dist/css/core.css}">
    <link rel="stylesheet" th:href="@{/dist/css/main.css}">
    <link rel="stylesheet" th:href="@{/dist/css/forms.css}">
    <link rel="stylesheet" th:href="@{/dist/css/login-full.css}">
</head>

<body class="login-page">

<main class="login-main">
    <div class="login-panel">

        <div class="login-brand">
            <a th:href="@{/}">
                <img th:src="@{/dist/images/taskwaka-bear-icon.png}" alt="">
                <span>TASKWAKA</span>
            </a>
            <p>팀의 작업과 일정을 한곳에서</p>
        </div>

        <div class="login-heading">
            <h1>로그인</h1>
            <p>계정으로 로그인하고 팀의 일정을 확인해 보세요.</p>
        </div>

        <form name="loginForm" th:action="@{/member/login}" method="post" onsubmit="return sendLogin()">

            <div class="login-field">
                <label for="loginId">아이디</label>
                <input type="text" id="loginId" name="login_id" placeholder="아이디를 입력하세요" autocomplete="username">
            </div>

            <div class="login-field">
                <label for="loginPassword">비밀번호</label>
                <input type="password" id="loginPassword" name="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password">
            </div>

            <div class="login-options">
                <label class="remember-label" for="rememberMe">
                    <input type="checkbox" id="rememberMe" class="rememberMe">
                    <span>아이디 저장</span>
                </label>

                <div class="login-find-links">
				<a th:href="@{/member/idFind}">아이디 찾기</a>
				    <span>|</span>
				    <a th:href="@{/member/pwdFind}">비밀번호 찾기</a>
				</div>
            </div>

            <button type="submit" class="login-submit">로그인</button>

            <p class="login-error" th:if="${message != null and message != ''}" th:text="${message}"></p>

			<p th:if="${param.reset != null and param.reset[0] == 'success'}"
			   style="text-align:center; color:#60794b; font-size:14px; margin-top:12px;">
			    비밀번호가 정상적으로 변경되었습니다. 새 비밀번호로 로그인해 주세요.
			</p>
        </form>

        <div class="login-signup">
            아직 계정이 없으신가요?
            <a th:href="@{/member/register}">회원가입</a>
        </div>

        <div class="social-section">
            <div class="social-heading">
                <span>간편 로그인</span>
            </div>

            <div class="social-buttons">
                <a th:href="@{/oauth/kakao}" class="social-btn social-kakao">
                	<img src="https://cdn.jsdelivr.net/npm/simple-icons@v16/icons/kakaotalk.svg" alt="">
                	<span>카카오</span>
                </a>

                <button type="button" class="social-btn social-naver" disabled title="네이버 로그인 준비 중">
                    <img src="https://cdn.jsdelivr.net/npm/simple-icons@v16/icons/naver.svg" alt="">
                    <span>네이버</span>
                </button>

                <button type="button" class="social-btn social-google" disabled title="구글 로그인 준비 중">
                    <img src="https://developers.google.com/identity/images/g-logo.png" alt="">
                    <span>Google</span>
                </button>
            </div>
        </div>

    </div>
</main>

<script>
    window.addEventListener('DOMContentLoaded', function () {
        const savedId = localStorage.getItem('savedLoginId');

        if (savedId) {
            document.loginForm.login_id.value = savedId;
            document.getElementById('rememberMe').checked = true;
        }
    });

    function sendLogin() {
        const f = document.loginForm;

        if (!f.login_id.value.trim()) {
            f.login_id.focus();
            return false;
        }

        if (!f.password.value.trim()) {
            f.password.focus();
            return false;
        }

        if (document.getElementById('rememberMe').checked) {
            localStorage.setItem('savedLoginId', f.login_id.value.trim());
        } else {
            localStorage.removeItem('savedLoginId');
        }

        return true;
    }
</script>

</body>
</html>
