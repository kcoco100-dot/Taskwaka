<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout3}">
<head>
    <title>나의 1:1 문의 | TASKWAKA</title>
</head>
<body>

<th:block layout:fragment="css">
    <link rel="stylesheet" th:href="@{/dist/css/site-inquiry-list.css}">
</th:block>

<th:block layout:fragment="content">
    <div class="site-inquiry-list-page">
        <div class="site-inquiry-list-container">
        
        	 <p th:if="${message != null}" th:text="${message}" class="text-danger"></p>

            <div class="site-inquiry-list-heading">
                <span class="site-inquiry-list-eyebrow">TASKWAKA SUPPORT</span>
                <h1>나의 1:1 문의</h1>
                <p>문의하신 내용과 답변 상태를 확인할 수 있습니다.</p>
            </div>

            <section class="site-inquiry-list-card">
                <div class="site-inquiry-list-toolbar">
                    <div>
                        <h2>문의 내역</h2>
                        <p>내가 작성한 문의를 확인할 수 있습니다.</p>
                    </div>
                    <a th:href="@{/service/inquiry/write}" class="site-inquiry-write-btn">문의 작성</a>
                </div>

                <div class="site-inquiry-table-wrap">
                    <table class="site-inquiry-table">
                        <thead>
                            <tr>
                                <th class="site-inquiry-number">번호</th>
                                <th>문의 제목</th>
                                <th class="site-inquiry-status-col">답변 상태</th>
                                <th class="site-inquiry-date-col">작성일</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="inquiry, status : ${inquiryList}">
                                <td class="site-inquiry-number" th:text="${status.count}">1</td>
                                <td class="site-inquiry-title"> 
                                	<a th:href="@{/service/inquiry/{id}(id=${inquiry.inquiry_id})}" th:text="${inquiry.title}">문의 제목</a>
                                	</td>
                                <td>
                                    <span th:if="${inquiry.status == 0}" class="site-inquiry-status pending">답변 대기</span>
                                    <span th:if="${inquiry.status == 1}" class="site-inquiry-status answered">답변 완료</span>
                                </td>
                                <td class="site-inquiry-date" th:text="${#dates.format(inquiry.created, 'yyyy-MM-dd')}">2026-10-22</td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(inquiryList)}">
                                <td colspan="4" class="site-inquiry-empty">
                                    등록한 문의가 없습니다.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </div>
    </div>
</th:block>

</body>
</html>
