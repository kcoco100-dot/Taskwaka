<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout3}">

<th:block layout:fragment="css">
    <link rel="stylesheet" th:href="@{/dist/css/home.css}">
    <link rel="stylesheet" th:href="@{/dist/css/page-shell.css}">
    <link rel="stylesheet" th:href="@{/dist/tree/growthTree.css}">
</th:block>

<th:block layout:fragment="content">
    <div class="home-layout">
        <nav th:replace="~{layout/homeSidebar::homeSidebar('growthTree')}"></nav>

        <div class="section shell-section">
            <div class="page-heading">
                <h1 class="page-title">팀 성장나무</h1>
                <p class="page-description">
                    팀의 활동으로 나무를 키우고 함께 꾸며보세요.
                </p>
            </div>

            <div class="shell-content growth-content">

                <!-- 성장 상태 -->
                <div class="growth-summary">
                    <div>현재 단계 <strong>—</strong></div>
                    <div>누적 경험치 <strong>— EXP</strong></div>
                    <div>구매 가능 경험치 <strong>— EXP</strong></div>
                </div>

                <!-- 나무 이미지와 커스텀 아이템 -->
                <div class="tree-preview">
                		<span class="tree-preview-label">나무 미리보기</span>
                    
                    <div class="tree-image-area">
                        <img class="tree-image" src="/dist/tree/line/seed.png"
                                th:src="@{/dist/tree/line/seed.png}" alt="씨앗 단계의 팀 성장나무">
                    
                    <!-- 추후 착용 아이템 이미지 여기에 추가 예정 -->
                    </div>
                    
                    <p class="tree-preview-description">
                        팀 활동으로 모은 경험치로 나무가 성장해요!
                    </p>
                    
                </div>

                <!-- 성장 단계와 진행률 -->
                <div class="growth-stages">
                    <h2>성장 단계</h2>
                    <ol>
                        <li>
                            <div class="growth-stage-image">
                                <img src="/dist/tree/line/seed.png" th:src="@{/dist/tree/line/seed.png}" alt="" loading="lazy">
                            </div>
                            <span>씨앗</span>
                        </li>
                        <li>
                            <div class="growth-stage-image">
                                <img src="/dist/tree/line/sprout.png" th:src="@{/dist/tree/line/sprout.png}" alt="" loading="lazy">
                            </div>
                            <span>새싹</span>
                        </li>
                        <li>
                            <div class="growth-stage-image">
                                <img src="/dist/tree/line/small-tree.png" th:src="@{/dist/tree/line/small-tree.png}" alt="" loading="lazy">
                            </div>
                            <span>작은 나무</span>
                        </li>
                        <li>
                            <div class="growth-stage-image">
                                <img src="/dist/tree/line/big-tree.png" th:src="@{/dist/tree/line/big-tree.png}" alt="" loading="lazy">
                            </div>
                            <span>큰 나무</span>
                        </li>
                        <li>
                            <div class="growth-stage-image">
                                <img src="/dist/tree/line/king-tree-crowned.png" th:src="@{/dist/tree/line/king-tree-crowned.png}" alt="" loading="lazy">
                            </div>
                            <span>왕 나무</span>
                        </li>
                    </ol>

                </div>

                <!-- 최근 경험치 획득 내역 -->
                <div class="growth-history">
                    <h2>최근 팀 활동</h2>

                </div>

                <!-- 추후 상점과 커스텀 기능 -->
                <div class="tree-custom">
                    <h2>나무 꾸미기</h2>
                    <p>5단계부터 아이템을 구매할 수 있습니다.</p>

                </div>

            </div>
        </div>
    </div>
</th:block>

<th:block layout:fragment="script"></th:block>
</html>
